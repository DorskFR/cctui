id: SEC
class: secrets
mode: probe
description: >
  Nothing the agent can read holds a real credential; credentials held by other
  components cannot be recovered from the agent's position.
cells:
  harness: [claude-code, codex, opencode]
  dispatcher: [kube, docker]
  net_mode: [transparent]
  posture: [root, nonroot]
probes: [SEC-01, SEC-02]
expect: contained
timeout_secs: 120
budget_usd: 0
