# Example docker-dispatcher confinement for a red-team cell. Transparent egress
# (NET_ADMIN + iptables redirect), strict Landlock, a deny-all allow-list. The
# cell holds only canary credentials; any canary use is a finding (Phase 3).
egress: transparent
landlock_strict: true
net_allow: []
env:
  WORKER_NET_MODE: transparent
