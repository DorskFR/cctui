# Example WorkerProfile shape for a red-team cell on kube. Same placement and
# policies as production workers, running the probe image (README.md); its own
# service identity reads only canary secrets. Values are placeholders.
apiVersion: cctui.dev/v1
kind: WorkerProfile
metadata:
  name: redteam
spec:
  posture: nonroot
  egress: transparent
  landlockStrict: true
  netAllow: []
  serviceAccountName: cctui-redteam
