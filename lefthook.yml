pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo +nightly fmt --all
      stage_fixed: true
    biome:
      glob: "*.{json,yaml,yml,md}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # The root biome.json covers data/docs files only and has the linter off.
    # Source linting is per-project, using each project's own biome.json and its
    # locally installed biome.
    biome-webui:
      root: "webui/"
      glob: "webui/src/**/*.ts"
      run: npx --no-install biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # Ratchet against new :global(...) CSS overrides in the webui. Reaching into a
    # tsumikit atom's scoped class from a parent is banned (webui/DESIGN.md rule 4) —
    # style atoms via props/variants, or wrap in a LOCAL element so scoped CSS
    # reaches it. Only ADDED lines are flagged, so the existing backlog doesn't
    # block edits; clear it opportunistically. Shares its implementation with the
    # no-css-global CI job.
    no-css-global:
      glob: "webui/**/*.svelte"
      run: bash scripts/no-css-global.sh --staged
    # A key ending in _pre/_post/_before/_after/_prefix/_suffix is half a sentence
    # glued together in markup, so no translator can fix word order. Also holds
    # every locale to the same key set. Shares its implementation with the
    # i18n-messages CI job.
    i18n-messages:
      glob: "webui/messages/*.json"
      run: bash scripts/check-i18n.sh
    # Ticket ids and wave/lane notes belong in commits and PRs, not in comments
    # or test names. Shares its implementation with the comment-refs CI job.
    comment-refs:
      glob: "{*.rs,*.ts,*.svelte,*.sh,*.yml,*.yaml,*.service,*Dockerfile,Makefile,**/Makefile,docs/*.md,docs/**/*.md}"
      run: bash scripts/check-comment-refs.sh
    # Private names stay out of the repo. The list is local
    # (~/.config/cctui/forbidden-terms.txt) and the FORBIDDEN_TERMS secret in CI;
    # hits print only their location.
    forbidden-terms:
      run: bash scripts/check-forbidden-terms.sh --staged

commit-msg:
  commands:
    forbidden-terms:
      run: bash scripts/check-forbidden-terms.sh --message {1}

pre-push:
  parallel: true
  commands:
    forbidden-terms:
      use_stdin: true
      run: bash scripts/check-forbidden-terms.sh --pre-push
    # Each check runs only when the pushed commits touch its area (see
    # scripts/ci-changes.sh); CI runs the full suites.
    clippy:
      run: bash scripts/ci-prepush.sh clippy
    test:
      run: bash scripts/ci-prepush.sh rust
    webui-test:
      run: bash scripts/ci-prepush.sh webui
    # Mirror of the schema-drift workflow, against the vendored schema.
    schema-drift:
      run: bash scripts/ci-prepush.sh schema
