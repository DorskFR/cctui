pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo +nightly fmt --all
      stage_fixed: true
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
    check:
      glob: "*.rs"
      run: cargo check --workspace
    biome:
      glob: "*.{json,yaml,yml,md}"
      run: biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # Ratchet against new :global(...) CSS overrides in the webui. Reaching into a
    # tsumikit atom's scoped class from a parent is banned (webui/DESIGN.md rule 4) —
    # style atoms via props/variants, or wrap in a LOCAL element so scoped CSS
    # reaches it. We only flag ADDED lines, so the existing backlog doesn't block
    # edits; clear it opportunistically. Matches ":global(" so prose/comments that
    # merely mention :global don't trip it.
    no-css-global:
      glob: "webui/**/*.svelte"
      run: |
        added=$(git diff --cached -U0 -- {staged_files} | awk '/^\+/ && !/^\+\+\+/ && /:global\(/')
        if [ -n "$added" ]; then
          echo "✖ New :global(...) CSS override in a Svelte file — forbidden (webui/DESIGN.md rule 4)."
          echo "  Style tsumikit atoms via props/variants, or wrap the styled bit in a LOCAL"
          echo "  element so its scoped CSS reaches it. Offending added lines:"
          echo "$added"
          exit 1
        fi

pre-push:
  commands:
    # Mirror of the schema-drift CI job (.github/workflows/schema-drift.yml) so
    # drift is caught locally before it reaches CI. Re-fetches the upstream
    # Claude Code settings schema and diffs (jq -S, so formatting/key-order is
    # ignored) against the vendored copy the settings catalog consumes.
    schema-drift:
      run: |
        set -eu
        url=https://json.schemastore.org/claude-code-settings.json
        vendored=crates/cctui-server/src/settings_catalog/claude-code-settings.schema.json
        curl -fsSL "$url" -o /tmp/cctui-upstream-schema.json
        jq -S . "$vendored" > /tmp/cctui-vendored.norm.json
        jq -S . /tmp/cctui-upstream-schema.json > /tmp/cctui-upstream.norm.json
        if ! diff -q /tmp/cctui-vendored.norm.json /tmp/cctui-upstream.norm.json >/dev/null; then
          echo "✖ Claude Code settings schema drift: upstream differs from $vendored"
          echo "  Re-vendor:  curl -fsSL $url -o $vendored"
          echo "  Then review catalog.toml for added/removed keys and run:"
          echo "    cargo test -p cctui-server settings_catalog"
          exit 1
        fi
