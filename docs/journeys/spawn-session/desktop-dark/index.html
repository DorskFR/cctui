<h1>Start a new agent</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="01-dialog.png" alt="dialog">
<figcaption><strong>Open the new-session dialog</strong> Everything a run needs is in this one dialog: the machine, the folder, the prompt and the profile.</figcaption>
</figure>
<figure>
<img src="02-where.png" alt="where">
<figcaption><strong>Pick where it runs</strong> Choose the machine, then the folder. That folder is the agent’s whole world — it reads and edits what is inside it and nothing else, so point it at the project you actually mean. Set them now.</figcaption>
</figure>
<figure>
<img src="03-filled.png" alt="filled">
<figcaption><strong>Say what you want done</strong> This is the agent’s brief, and it is the whole instruction — it will not ask what you meant before it starts. Be as specific as you would be with a new colleague.</figcaption>
</figure>
<figure>
<img src="04-profiles.png" alt="profiles">
<figcaption><strong>The profile decides how it thinks</strong> A profile bundles four things: the harness, the model, how hard it reasons, and how much it may do without asking. Pick one rather than setting all four every launch — keep a cheap one for throwaway work and a careful one for the rest.</figcaption>
</figure>
<figure>
<img src="05-saved.png" alt="saved">
<figcaption><strong>Draft it rather than launch it</strong> Launch would start the agent now — it would begin reading and editing the folder you chose. Draft, beside it, saves all of this and runs nothing. Press Draft: you can launch it whenever you like.</figcaption>
</figure>
<figure>
<img src="06-draft.png" alt="draft">
<figcaption><strong>Where the draft went</strong> Drafts have their own group in the list, switched off until you ask for it — behind this button, with all the other groups. Your run waits there with its machine, folder, profile and prompt intact, and nothing executes until you launch it.</figcaption>
</figure>
