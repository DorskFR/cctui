<h1>Start a new agent</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-dialog.png" alt="dialog">
<figcaption><strong>Open the new-session dialog</strong> Everything a run needs is in this one dialog: the machine, the folder, the prompt and the profile.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-filled.png" alt="filled">
<figcaption><strong>Say what you want done</strong> Say what you want done. The profile below decides which harness and model carry it out.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-profiles.png" alt="profiles">
<figcaption><strong>The profile decides how it thinks</strong> A profile bundles the harness, model, reasoning effort and permission mode. Pick one here rather than setting four things every time you launch.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-saved.png" alt="saved">
<figcaption><strong>Save it as a draft</strong> The Draft button lights up once the machine and folder are set. This saves the run on your instance without starting it — nothing executes until you launch it.</figcaption>
</figure>
<figure>
<img src="desktop-dark/05-draft.png" alt="draft">
<figcaption><strong>The draft is waiting</strong> Your draft is here, holding the machine, folder, profile and prompt until you launch it.</figcaption>
</figure>
