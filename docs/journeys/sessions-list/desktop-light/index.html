<h1>Read the fleet at a glance</h1>
<h2>viewport=desktop theme=light</h2>
<figure>
<img src="01-list.png" alt="list">
</figure>
<figure>
<img src="02-search.png" alt="search">
<figcaption><strong>Narrow the list as you type</strong> Plain words match titles and prompts. Add a field — machine, label, status — to cut straight to a slice of the fleet instead of scrolling it.</figcaption>
</figure>
<figure>
<img src="03-sections.png" alt="sections">
<figcaption><strong>Keep the ones that matter in reach</strong> Starred sessions get their own group above everything else — the fastest way to pin the two or three runs you actually care about today.</figcaption>
</figure>
<figure>
<img src="04-options.png" alt="options">
<figcaption><strong>Group by whatever you are debugging</strong> Group by machine when you suspect one box, by project when you are context-switching. Colour-by tints the cards on a second dimension, so you can read both at once.</figcaption>
</figure>
<figure>
<img src="05-group.png" alt="group">
<figcaption><strong>Collapse or clear a whole group</strong> The eye folds a group away without losing it. Beside it, archive retires every session in that group in one move — how a finished batch leaves the list for good.</figcaption>
</figure>
