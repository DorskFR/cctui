<h1>Read the fleet at a glance</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-list.png" alt="list">
<figcaption><strong>Grouped by what it needs from you</strong> This is the one screen you will keep open. Agents are not listed by age but by what they are waiting for: anything blocked on an answer from you rises to the top, so a fleet of thirty still reads in one glance.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-anatomy.png" alt="anatomy">
<figcaption><strong>What one row tells you</strong> Each row carries the session’s title, the machine it runs on, the folder it works in, how long since it last did anything, and what it has spent. That is enough to decide whether it needs you without opening it.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-sections.png" alt="sections">
<figcaption><strong>Turn whole groups off</strong> Behind this button every group is an independent switch — live, blocked, in review, done, archived, and a starred group of your own. Switching off the ones you are not working in is what keeps the list short as the fleet grows.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-options.png" alt="options">
<figcaption><strong>Group by whatever you are debugging</strong> This holds the view settings. Group by machine when you suspect one box, by project when you are context-switching; colour-by tints the rows on a second dimension so you can read both at once. None of it touches the sessions themselves.</figcaption>
</figure>
<figure>
<img src="desktop-dark/05-view.png" alt="view">
<figcaption><strong>Try it: dense rows or roomy cards</strong> Switch it here — or in the ⋯ menu when the bar is narrow. Rows fit more of the fleet on screen; cards give each session room for its prompt and its latest activity. Your choice sticks between visits.</figcaption>
</figure>
<figure>
<img src="desktop-dark/06-search.png" alt="search">
<figcaption><strong>And you can always just type</strong> Type anything here and the list narrows as you go. There is a whole query language behind this box — conditions on machine, label and status — and a later guide is devoted to it.</figcaption>
</figure>
<figure>
<img src="desktop-dark/07-cleared.png" alt="cleared">
<figcaption><strong>Empty it to get everyone back</strong> Clear the box and the whole fleet returns, grouped as before. Nothing you did here changed a single session — this screen is a lens, never a lever.</figcaption>
</figure>
