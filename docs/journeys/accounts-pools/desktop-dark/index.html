<h1>Connect a provider account</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="01-board.png" alt="board">
<figcaption><strong>Every account you can run on</strong> An account is one provider credential — the thing an agent bills its tokens to. This board is the whole list, and until it holds one, nothing can be launched.</figcaption>
</figure>
<figure>
<img src="02-anatomy.png" alt="anatomy">
<figcaption><strong>What each card tells you</strong> A card carries its name and emoji, who owns it, which providers and models it can reach, and how much of its budget is already spent. The grip on its left edge is how it joins a pool.</figcaption>
</figure>
<figure>
<img src="03-pools.png" alt="pools">
<figcaption><strong>A pool is a set of interchangeable accounts</strong> Aim a session at a pool instead of one account and it elects whichever member has the most budget left, so a weekly limit reached on one account does not stop your work. Drag a card by its grip onto a pool to add it, or use the card’s own menu — the same change without a mouse, which is how it is done on a phone.</figcaption>
</figure>
<figure>
<img src="04-add.png" alt="add">
<figcaption><strong>Add your first account</strong> Open the dialog. You will name the credential, pick its provider and paste the key — nothing leaves this instance, and the key is encrypted before it is stored.</figcaption>
</figure>
<figure>
<img src="05-closed.png" alt="closed">
<figcaption><strong>Close it for now</strong> Nothing is saved until you submit, so dismissing it changes nothing. Come back with a real key and the board will have its first card — then a session has something to run on.</figcaption>
</figure>
