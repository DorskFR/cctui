<h1>Connect a provider account</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-board.png" alt="board">
<figcaption><strong>Every account you can run on</strong> Accounts are the provider credentials your agents run on. This board is empty until you add one.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-pool.png" alt="pool">
<figcaption><strong>A pool is a set of interchangeable accounts</strong> Launches aimed at the pool elect a member by headroom, so a spent weekly budget on one account does not stop the work.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-handle.png" alt="handle">
<figcaption><strong>Drag an account into a pool</strong> The grip on a card lifts it; dropping it on a pool adds it to the membership.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-menu.png" alt="menu">
<figcaption><strong>Or add it from the card menu</strong> The same membership change without a mouse drag, which is also how it is done on a phone.</figcaption>
</figure>
