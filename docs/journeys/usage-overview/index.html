<h1>See what the fleet is costing</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-tiles.png" alt="tiles">
<figcaption><strong>The fleet in four numbers</strong> Sessions running now, sessions waiting on you, machines online, and the all-time total. They read zero until your first run.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-periods.png" alt="periods">
<figcaption><strong>Is today busier than usual?</strong> The same count over today, yesterday, this week and this month. One day on its own means little; next to the others it tells you whether the fleet is speeding up.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-windows.png" alt="windows">
<figcaption><strong>Tokens by time window</strong> The same usage read over the last hour, day, week and month, split into input, output and cached tokens. Cached tokens are re-read context and cost a fraction of fresh input.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-analytics.png" alt="analytics">
<figcaption><strong>Where the tokens went</strong> Daily volume and a per-model breakdown, so an expensive habit shows up before the bill does. A model you did not mean to use is usually visible here first.</figcaption>
</figure>
