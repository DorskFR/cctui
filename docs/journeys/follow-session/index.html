<h1>Follow a session while it works</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-drawer.png" alt="drawer">
<figcaption><strong>Open a session</strong> Tapping a session by name opens its conversation — beside the list on a desktop, over it on a phone.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-timeline.png" alt="timeline">
<figcaption><strong>Read the whole transcript</strong> Every prompt, reply, tool call and tool result is kept, so you can see exactly what the agent did.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-tools.png" alt="tools">
<figcaption><strong>Filter the noise</strong> Hiding the assistant messages leaves the tool calls — the fastest way to audit what an agent touched.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-reply.png" alt="reply">
<figcaption><strong>Steer it mid-run</strong> A reply goes to the running agent, so you can redirect the work without restarting it.</figcaption>
</figure>
