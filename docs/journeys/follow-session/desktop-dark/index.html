<h1>Follow a session while it works</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="01-drawer.png" alt="drawer">
<figcaption><strong>Open a session</strong> Open one by its name. The conversation slides in beside the list on a desktop and over it on a phone, so you never lose your place in the fleet.</figcaption>
</figure>
<figure>
<img src="02-header.png" alt="header">
<figcaption><strong>Who is running this, and where</strong> The top row answers the questions you ask first: is it alive, which machine is it on, which account is paying for it, and what is it called.</figcaption>
</figure>
<figure>
<img src="03-details.png" alt="details">
<figcaption><strong>The rest of the detail folds away</strong> Everything that would crowd the header — the full path, the session id, its parent if it was forked — lives behind this toggle, so the two rows above stay readable.</figcaption>
</figure>
<figure>
<img src="04-activity.png" alt="activity">
<figcaption><strong>What it is doing right now</strong> While a turn is live this strip names the step in progress, the tool it is running, how long the turn has taken and how far through its task list it is. Between turns it simply reads idle — which is how you tell a thinking agent from a finished one.</figcaption>
</figure>
<figure>
<img src="05-timeline.png" alt="timeline">
<figcaption><strong>Everything it did is on the record</strong> Each message is badged with its kind: your prompts, the agent’s replies, its reasoning, every tool call and the result that came back. Nothing is summarised away.</figcaption>
</figure>
<figure>
<img src="06-line.png" alt="line">
<figcaption><strong>Lift one message out</strong> Any single message can be pinned to find again, copied as Markdown for a ticket, or saved as an image to paste into a review.</figcaption>
</figure>
<figure>
<img src="07-tools.png" alt="tools">
<figcaption><strong>Try it: leave only what it touched</strong> Turn the assistant pill off. The prose disappears and the tool calls remain — the fastest way to audit what an agent actually did to your files.</figcaption>
</figure>
<figure>
<img src="08-restored.png" alt="restored">
<figcaption><strong>And put it back</strong> Click it again. Filters only ever change what this pane shows you — nothing was removed from the transcript, and the setting does not follow you to the next session.</figcaption>
</figure>
<figure>
<img src="09-reply.png" alt="reply">
<figcaption><strong>Steer it from here</strong> Anything you type goes to the running agent, so you can redirect it mid-task instead of stopping it and starting again.</figcaption>
</figure>
