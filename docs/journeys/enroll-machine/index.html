<h1>Bring a machine into the fleet</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-access.png" alt="access">
<figcaption><strong>Start here: enroll a machine</strong> Access lists everyone and everything that can act on this instance. Until a machine has enrolled, this card is the only thing here that matters.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-command.png" alt="command">
<figcaption><strong>What this command does</strong> It points the daemon at this server and registers the machine under your user. Swap the token placeholder for one of your own keys — that token is what ties the machine to you.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-enroll.png" alt="enroll">
<figcaption><strong>Waiting for the machine to report in</strong> The guide moves on by itself the moment the machine checks in. If you would rather finish setting it up later, leave this step and come back — nothing is lost.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-user.png" alt="user">
<figcaption><strong>Open your own user</strong> Everything attached to an identity is here: the keys it signs in with, the machines it enrolled, its tokens and its AI accounts.</figcaption>
</figure>
<figure>
<img src="desktop-dark/05-machines.png" alt="machines">
<figcaption><strong>The machines that answered</strong> The machine you just enrolled is listed here with its heartbeat. Online means it can host a session right now.</figcaption>
</figure>
