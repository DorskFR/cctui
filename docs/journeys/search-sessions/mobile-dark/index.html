<h1>Find a session again</h1>
<h2>viewport=mobile theme=dark</h2>
<figure>
<img src="01-before.png" alt="before">
<figcaption><strong>Start from the whole list</strong> Every session you have run is searchable, live ones and finished ones alike.</figcaption>
</figure>
<figure>
<img src="02-text.png" alt="text">
<figcaption><strong>Search the transcripts, not just the titles</strong> A plain word is matched against what the agents actually said and did, so you can find a run by what it touched.</figcaption>
</figure>
<figure>
<img src="03-facet.png" alt="facet">
<figcaption><strong>Narrow by label, machine or status</strong> Typed filters like label:, machine: and status: combine with the free text to cut a large fleet down fast.</figcaption>
</figure>
