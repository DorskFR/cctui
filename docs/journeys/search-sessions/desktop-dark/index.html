<h1>Find anything across sessions</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="01-box.png" alt="box">
<figcaption><strong>One box over every session</strong> This searches what the agents actually said and did, not just the names you gave the runs. A session you never labelled is still findable by what it touched.</figcaption>
</figure>
<figure>
<img src="02-before.png" alt="before">
<figcaption><strong>Everything you have run is in here</strong> Live runs and finished ones alike. Count the rows now — the next two steps will cut this list down in front of you.</figcaption>
</figure>
<figure>
<img src="03-text.png" alt="text">
<figcaption><strong>Type a word the run would have used</strong> Try “pagination”. A plain word is matched against the transcripts themselves, so you find a session by what it touched rather than by what you called it.</figcaption>
</figure>
<figure>
<img src="04-facet.png" alt="facet">
<figcaption><strong>Turn a word into a condition</strong> Replace it with “label:backend”. Prefixes like label:, machine: and status: filter instead of searching, and the box offers the values it already knows.</figcaption>
</figure>
<figure>
<img src="05-combined.png" alt="combined">
<figcaption><strong>Stack them to answer a real question</strong> Conditions and free text apply together: status:failed with a word finds the run that broke on the thing you half-remember. That is the whole query language.</figcaption>
</figure>
<figure>
<img src="06-cleared.png" alt="cleared">
<figcaption><strong>Empty the box to get the fleet back</strong> Clear it and every session returns. Nothing was hidden or archived — search only ever changes what this list shows you.</figcaption>
</figure>
