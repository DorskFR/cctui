<h1>What cctui is</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="01-overview.png" alt="overview">
<figcaption><strong>Start here: is the fleet healthy?</strong> One control room for every Claude Code session you run. These tiles answer the first question before you touch anything — what is live, what is stuck, which machines are up.</figcaption>
</figure>
<figure>
<img src="02-sessions.png" alt="sessions">
<figcaption><strong>Sessions — where the work happens</strong> Every run you have started, grouped by what it needs from you. The ones blocked on an answer rise to the top, so a long fleet still reads in one glance.</figcaption>
</figure>
<figure>
<img src="03-accounts.png" alt="accounts">
<figcaption><strong>Accounts — where the quota comes from</strong> Provider accounts are grouped into pools, and a session draws from a pool rather than a fixed account, so one hitting a rate limit steps aside instead of stalling the queue.</figcaption>
</figure>
<figure>
<img src="04-access.png" alt="access">
<figcaption><strong>Access — what may run work</strong> Machines supply the compute, and they join the fleet from here with a single enrolment command. If a session cannot find anywhere to run, this is the page to open.</figcaption>
</figure>
<figure>
<img src="05-guides.png" alt="guides">
<figcaption><strong>Now walk it for real</strong> That is every screen. The remaining guides run inside the app, pointing at the real controls in order — connect an account, enrol a machine, start a session, follow it. They all live on this page.</figcaption>
</figure>
