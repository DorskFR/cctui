<h1>What cctui is</h1>
<h2>viewport=mobile theme=dark</h2>
<figure>
<img src="01-overview.png" alt="overview">
<figcaption><strong>Start here: is the fleet healthy?</strong> One control room for every coding agent you run. These tiles answer the first question before you touch anything — what is live, what is stuck, which machines are up.</figcaption>
</figure>
<figure>
<img src="02-attention.png" alt="attention">
<figcaption><strong>The only number that needs you</strong> An agent waiting on an answer stops making progress until you reply. That is why this count sits on the landing page rather than inside a list you have to go looking for.</figcaption>
</figure>
<figure>
<img src="03-nav.png" alt="nav">
<figcaption><strong>The nav is the whole app</strong> Every page hangs off this rail. Sessions is where most of the work happens — open it.</figcaption>
</figure>
<figure>
<img src="04-sessions.png" alt="sessions">
<figcaption><strong>Sessions — where the work happens</strong> Every run you have started, grouped by what it needs from you. The ones blocked on an answer rise to the top, so a long fleet still reads in one glance.</figcaption>
</figure>
<figure>
<img src="05-start.png" alt="start">
<figcaption><strong>Starting one</strong> This turns a prompt into a running agent: pick the machine, the folder and the account, and it works in the background whether or not you keep the tab open.</figcaption>
</figure>
<figure>
<img src="06-accounts.png" alt="accounts">
<figcaption><strong>AI accounts — the credentials work runs on</strong> Provider accounts can be grouped into pools, and a session can draw from a pool rather than one fixed account, so one hitting a rate limit steps aside instead of stalling the queue.</figcaption>
</figure>
<figure>
<img src="07-access.png" alt="access">
<figcaption><strong>Users &amp; keys — who may run work</strong> Machines supply the compute, and they join the fleet from here with a single enrolment command. If a session cannot find anywhere to run, this is the page to open.</figcaption>
</figure>
<figure>
<img src="08-guides.png" alt="guides">
<figcaption><strong>Now walk it for real</strong> That is every screen. The rest of the guides run inside the app and point at the real controls in order — read the fleet, connect an account, enrol a machine, start a session, follow it. Start with this one.</figcaption>
</figure>
