<h1>Tune how agents behave</h1>
<h2>viewport=desktop theme=dark</h2>
<figure>
<img src="desktop-dark/01-appearance.png" alt="appearance">
<figcaption><strong>Make it yours</strong> Theme, text size, language and where the navigation sits. Every one of these is remembered per account, so the app looks the same on your phone as on your desk.</figcaption>
</figure>
<figure>
<img src="desktop-dark/02-theme.png" alt="theme">
<figcaption><strong>Pick a theme, or let it follow the system</strong> Auto remembers one light and one dark theme and swaps between them as your system does. Pick a specific theme instead and it stays put at every hour of the day.</figcaption>
</figure>
<figure>
<img src="desktop-dark/03-sessions.png" alt="sessions">
<figcaption><strong>Defaults for every run</strong> How the list sorts and groups, and what a new session starts with, so you set it once instead of every time. The conversation options here also decide how much of a transcript you see at a glance.</figcaption>
</figure>
<figure>
<img src="desktop-dark/04-execution.png" alt="execution">
<figcaption><strong>How much rope an agent gets</strong> Permission handling, auto-approval and the phrases that mean an agent has stopped early rather than finished.</figcaption>
</figure>
<figure>
<img src="desktop-dark/05-privacy.png" alt="privacy">
<figcaption><strong>Secrets never reach the transcript</strong> Tokens and keys are detected and replaced before anything is stored, so a leaked credential does not end up sitting in your history.</figcaption>
</figure>
