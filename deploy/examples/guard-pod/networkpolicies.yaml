# Static policies for workers whose profile sets `spec.guard.placement: pod`.
# They select by label, so no policy is created per dispatch: the per-dispatch
# proxy token is what keeps one worker off another dispatch's guard.
#
# The guard pod carries neither `cctui.dev/worker-profile` nor `job-name`, so
# a deny-all policy keyed on those does not select it. A namespace-wide one
# (`podSelector: {}`) does, and the guard ingress policy below then re-admits
# the workers. Guard egress (internet, the cctui server, the secret backend)
# stays whatever the namespace already allows the sidecar.
#
# Some CNIs also filter kubelet probes: allow the node to reach :15002 if the
# guard pod's startup probe fails.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cctui-guard-pod-worker
  namespace: cctui-workers
spec:
  podSelector:
    matchLabels:
      cctui.dev/guard-placement: pod
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              cctui.dev/role: guard-proxy
      ports:
        - { protocol: TCP, port: 15001 }
        - { protocol: TCP, port: 15002 }
        - { protocol: TCP, port: 15003 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cctui-guard-pod-ingress
  namespace: cctui-workers
spec:
  podSelector:
    matchLabels:
      cctui.dev/role: guard-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cctui.dev/guard-placement: pod
      ports:
        - { protocol: TCP, port: 15001 }
        - { protocol: TCP, port: 15002 }
        - { protocol: TCP, port: 15003 }
