# A canary profile whose guard-proxy runs as its own pod. Apply the release's
# WorkerProfile CRD, networkpolicies.yaml and rbac.yaml first.
apiVersion: cctui.dev/v1alpha1
kind: WorkerProfile
metadata:
  name: automation-guard-pod
  namespace: cctui-workers
spec:
  image: ghcr.io/dorskfr/cctui-worker:0.32.0
  posture: nonroot
  serviceAccountName: automation
  guard:
    placement: pod
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  maxInflight: 1
  preflight:
    mode: enforce
