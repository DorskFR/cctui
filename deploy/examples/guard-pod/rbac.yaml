# The kube dispatcher's Role in the worker namespace. A `pod` guard placement
# adds pods create/delete and services create/delete: the dispatcher creates
# each dispatch's guard Pod and Service and deletes them once its Job ends.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cctui-dispatcher
  namespace: cctui-workers
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete]
  - apiGroups: [cctui.dev]
    resources: [workerprofiles]
    verbs: [get]
