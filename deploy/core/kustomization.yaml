apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: cctui-core
resources:
  - server.yaml
  - ui.yaml
# A copy of deploy/features/core.toml: kustomize loads nothing outside this directory.
configMapGenerator:
  - name: cctui-core-features
    files:
      - core.toml
images:
  - name: ghcr.io/dorskfr/cctui
    newTag: 0.30.0
  - name: ghcr.io/dorskfr/cctui-ui
    newTag: 0.30.0
