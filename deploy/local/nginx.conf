# Local-stack override of webui/nginx.conf (mounted over
# /etc/nginx/conf.d/default.conf): adds the /api proxy so the SPA talks to the
# server same-origin. In real deployments the ingress does this routing; here
# nothing else fronts the two containers, and a cross-origin apiBase is blocked
# by the SPA's CSP (connect-src 'self').
server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location /api/ {
		proxy_pass http://cctui-server:8700;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $http_connection;
		proxy_set_header Host $host;
		proxy_read_timeout 1h;
		proxy_buffering off;
	}

	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		try_files $uri =404;
	}

	location = /config.js {
		add_header Cache-Control "no-store";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		try_files $uri =404;
	}

	location / {
		sub_filter '<script>' '<script nonce="$request_id">';
		sub_filter_once off;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Frame-Options "DENY" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
		try_files $uri $uri/ /index.html;
	}
}
