# Self-contained local cctui stack — pulls the published images and wires them
# together. No source build required. Works on Linux and macOS (Docker Desktop /
# OrbStack / colima).
#
#   cd deploy/local && docker compose up -d      # or: make local/up
#
# Then open http://localhost:8088 and log in with the admin token below
# (default `dev-admin`). The server API is on http://localhost:8700.
#
# The cctui-daemon is NOT containerised — it runs on your host so it can see your
# real `claude`/`codex` binaries and working directories. See the README
# ("Run cctui locally") for enrollment against this stack.

services:
  postgres:
    # pgautoupgrade migrates an existing PGDATA in place, so a volume created by
    # an older major keeps working across a bump instead of refusing to start.
    image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cctui
    volumes:
      # postgres 18 keeps PGDATA under /var/lib/postgresql/<major>/…, so mount
      # the parent — a mount at …/data never receives the data at all.
      - cctui-local-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cctui"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cctui-server:
    image: ${CCTUI_SERVER_IMAGE:-ghcr.io/dorskfr/cctui:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrations run automatically on start (compiled into the binary).
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cctui
      CCTUI_HOST: 0.0.0.0
      CCTUI_PORT: "8700"
      # Tokens you log in / enroll with. Change these for anything non-local.
      CCTUI_ADMIN_TOKENS: ${CCTUI_ADMIN_TOKENS:-dev-admin}
      # Encrypts stored provider credentials. Well-known default — change it
      # for anything non-local.
      CCTUI_VAULT_KEY: ${CCTUI_VAULT_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
      # Origin the daemon/clients reach this server at, from the host.
      CCTUI_EXTERNAL_URL: ${CCTUI_EXTERNAL_URL:-http://localhost:8700}
      # The UI origin, for the WS origin allowlist (403 otherwise).
      CCTUI_ALLOWED_ORIGINS: ${CCTUI_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    ports:
      - "${CCTUI_SERVER_PORT:-8700}:8700"
    restart: unless-stopped

  cctui-ui:
    image: ${CCTUI_UI_IMAGE:-ghcr.io/dorskfr/cctui-ui:latest}
    depends_on:
      - cctui-server
    # Same-origin /api proxy: the SPA's CSP blocks cross-origin apiBase.
    volumes:
      - ./config.js:/usr/share/nginx/html/config.js:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${CCTUI_UI_PORT:-8088}:8080"
    restart: unless-stopped

volumes:
  cctui-local-data:
