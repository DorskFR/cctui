# Pin the toolchain so local dev, lefthook (fmt/clippy/check) and the release
# Docker builds all use ONE Rust version. 1.97.1 matches deploy/*.Dockerfile
# (`FROM rust:1.97.1-slim-bookworm`), so a contributor's newer default stable no
# longer flags lints the shipped build never saw. fmt still runs on nightly via
# the explicit `cargo +nightly fmt` in lefthook.yml (rustfmt.toml needs unstable
# features); this pin only sets the DEFAULT toolchain for everything else.
[toolchain]
channel = "1.97.1"
