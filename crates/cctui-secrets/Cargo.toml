[package]
name = "cctui-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["bao", "k8s", "aws-sm"]
bao = ["dep:reqwest", "dep:serde_json"]
k8s = ["dep:reqwest", "dep:serde_json", "dep:base64"]
aws-sm = ["dep:aws-config", "dep:aws-sdk-secretsmanager", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
base64.workspace = true
rustls.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
