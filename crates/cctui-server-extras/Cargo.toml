[package]
name = "cctui-server-extras"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["cctui-server-kernel/test-support"]

[dependencies]
cctui-proto = { workspace = true, features = ["sqlx"] }
cctui-secrets.workspace = true
cctui-server-kernel.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dashmap = "6"
flate2 = "1"
hex.workspace = true
http = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
cctui-server-kernel = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
