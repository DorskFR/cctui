[package]
name = "cctui-server-blobs"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["cctui-server-kernel/test-support"]

[dependencies]
cctui-aws.workspace = true
cctui-proto.workspace = true
cctui-server-kernel.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes = "1"
futures-util.workspace = true
hex.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
cctui-server-kernel = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
