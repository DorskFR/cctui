# TUI feature-parity manifest.
#
# One entry per route in `cctui_proto::api::routes::ROUTES` and per
# `cctui_proto::ws::ServerEvent` variant. `crates/cctui-tui/src/parity.rs`
# fails `cargo test` when this file drifts from either.
#
#   tui = "handled" -> `module` names the file under crates/cctui-tui/src
#   tui = "planned" -> `ticket` names the epic ticket that will handle it
#   tui = "waived"  -> `reason` says why the TUI will never call it
#
# Flip "planned" to "handled" in the same commit that ships the handler.

