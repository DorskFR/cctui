[package]
name = "cctui-server-notify"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["cctui-server-kernel/test-support"]

[dependencies]
cctui-proto = { workspace = true, features = ["sqlx"] }
cctui-secrets.workspace = true
cctui-server-kernel.workspace = true
async-trait.workspace = true
aws-lc-rs = "1.18.1"
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
http = "1"
lettre.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
cctui-server-kernel = { workspace = true, features = ["test-support"] }
