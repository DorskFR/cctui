[package]
name = "cctui-server-kernel"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["dep:tower"]

[dependencies]
cctui-proto = { workspace = true, features = ["sqlx"] }
cctui-telemetry.workspace = true
cctui-crypto.workspace = true
cctui-secrets = { workspace = true, features = ["bao", "k8s"] }
anyhow.workspace = true
toml.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
dashmap = "6"
futures-util.workspace = true
http = "1"
reqwest.workspace = true
ring = "0.17"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
unicode-normalization = "0.1.25"
sha2.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tempfile.workspace = true
