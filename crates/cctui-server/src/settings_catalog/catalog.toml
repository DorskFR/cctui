[[presets]]
id = "quiet-defaults"
name = "Quiet defaults"
description = "Silence bundled skills/workflows/artifact + remote-control + telemetry/updater noise. All reversible per account. MANAGED keys may be ignored via a plain --settings file (needs a managed-settings drop-in) — see CCT-539."

# settings.json keys applied by the preset (deep-merged under managed hooks).
[presets.settings]
disableBundledSkills = true
disableWorkflows = true
disableArtifact = true
disableRemoteControl = true
remoteControlAtStartup = false
strictKnownMarketplaces = []
strictPluginOnlyCustomization = ["skills", "hooks"]
disableSideloadFlags = true

# env vars applied by the preset (merged into the session env).
[presets.env]
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
CLAUDE_CODE_DISABLE_BUNDLED_SKILLS = "1"
CLAUDE_CODE_DISABLE_WORKFLOWS = "1"
DISABLE_TELEMETRY = "1"
DO_NOT_TRACK = "1"
DISABLE_ERROR_REPORTING = "1"
DISABLE_AUTOUPDATER = "1"
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1"
