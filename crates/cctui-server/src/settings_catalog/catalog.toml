# Claude Code settings catalog — hand-maintained delta over the vendored JSON schema.
#
# The vendored schema (claude-code-settings.schema.json, draft-07) is the source of
# truth for TYPES / ENUMS / DEFAULTS of the keys it covers. This file adds what the
# schema lacks: per-key POLICY TAGS (safe/care/managed/system), the docs-only keys the
# schema still lags on, a curated env-var allowlist, and named presets.
#
# Consumed by the settings_catalog Rust module (server-side allowlist validation, CCT-538)
# and the webui account settings editor (CCT-541). Keep in sync with the Claude Code docs.
#
# Policy tags:
#   safe    — good per-account toggle candidate, low blast radius
#   care    — exposable but has caveats (cost / security / footgun)
#   managed — org/admin managed-settings only; do NOT expose per-account
#   system  — CLI-written state or session-only; not a user-facing toggle
#
# `source` is "schema" (present in the vendored schema) or "docs" (docs-only delta).

schema_url = "https://json.schemastore.org/claude-code-settings.json"
schema_file = "claude-code-settings.schema.json"
captured = "2026-07-02"

