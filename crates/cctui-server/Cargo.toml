[package]
name = "cctui-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# Optional GitHub integration (CCT-373 / GH-PKG-1). A build without this feature
# contains zero GitHub code, routes, or schema.
github = ["dep:cctui-github"]

[dependencies]
cctui-proto.workspace = true
cctui-crypto.workspace = true
cctui-query.workspace = true
cctui-github = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64.workspace = true
thiserror = "2"
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tower = "0.5"
http = "1"
dashmap = "6"
async-trait.workspace = true
reqwest.workspace = true
ts-rs.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
bollard = "0.18"
sha1 = "0.10"
toml = "0.8"
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# Request-level regression test for the authz layer ordering (CCT-423): drive a
# real request through the assembled router via `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
