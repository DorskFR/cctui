[package]
name = "cctui-server"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
cctui-proto.workspace = true
cctui-crypto.workspace = true
cctui-query.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
anyhow.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
sha2.workspace = true
hmac = "0.12"
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
http = "1"
dashmap = "6"
async-trait.workspace = true
reqwest.workspace = true
ts-rs.workspace = true
toml = "0.8"
log = "0.4.33"

[dev-dependencies]
reqwest.workspace = true
tokio = { version = "1", features = ["full"] }
tempfile = "3"
# Request-level regression test for the authz layer ordering (CCT-423): drive a
# real request through the assembled router via `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
