[package]
name = "cctui-server-accounts"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["cctui-server-kernel/test-support"]

[dependencies]
cctui-server-kernel.workspace = true
regex.workspace = true
base64.workspace = true
toml.workspace = true
cctui-proto = { workspace = true, features = ["sqlx"] }
cctui-secrets.workspace = true
cctui-crypto.workspace = true
cctui-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util.workspace = true
reqwest.workspace = true
dashmap = "6"
flate2 = "1"
zstd.workspace = true
axum.workspace = true
http = "1"
sha2.workspace = true
hex.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.6"

[dev-dependencies]
cctui-server-kernel = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
rustls.workspace = true
