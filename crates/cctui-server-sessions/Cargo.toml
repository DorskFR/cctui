[package]
name = "cctui-server-sessions"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
test-support = ["cctui-server-kernel/test-support"]

[dependencies]
cctui-crypto.workspace = true
cctui-proto = { workspace = true, features = ["sqlx"] }
cctui-query.workspace = true
cctui-server-kernel.workspace = true
cctui-telemetry.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dashmap = "6"
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
http = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
cctui-server-kernel = { workspace = true, features = ["test-support"] }
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
