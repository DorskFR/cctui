[package]
name = "cctui-guard-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "cctui-guard-proxy"
path = "src/main.rs"

[dependencies]
cctui-guard = { path = "../cctui-guard" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest.workspace = true
aws-config.workspace = true
aws-sdk-secretsmanager.workspace = true
aws-sigv4.workspace = true
aws-credential-types.workspace = true
clap = { version = "4", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false, features = ["net"] }
libc = "0.2"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
webpki-roots = "1"
base64.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
