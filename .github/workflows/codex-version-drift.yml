name: codex-version-drift

on:
  pull_request:
    paths:
      - "crates/cctui-daemon/src/adapters/codex/**"
      - "deploy/worker.Dockerfile"
      - "scripts/check-codex-version-drift.sh"
      - "scripts/check-codex-version-drift.test.sh"
      - ".github/workflows/codex-version-drift.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: codex version floor drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Drift check self-test
        run: bash scripts/check-codex-version-drift.test.sh
      - name: Check Codex version floor
        run: bash scripts/check-codex-version-drift.sh
