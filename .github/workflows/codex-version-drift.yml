name: codex-version-drift

# CCT-630: enforce that the pinned Codex version stays consistent across
# contract::CODEX_PINNED_VERSION and the worker image ARG CODEX_VERSION.

on:
  pull_request:
    paths:
      - "crates/cctui-daemon/src/adapters/codex/**"
      - "deploy/worker.Dockerfile"
      - "scripts/check-codex-version-drift.sh"
      - ".github/workflows/codex-version-drift.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: codex version pin drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Codex version pin
        run: bash scripts/check-codex-version-drift.sh
