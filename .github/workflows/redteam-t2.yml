name: redteam-t2

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      expect_version:
        description: "Fail unless the deployment reports this version (the release candidate)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "scripts/redteam-t2*"
      - ".github/workflows/redteam-t2.yml"

permissions:
  contents: read

concurrency:
  group: redteam-t2-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

env:
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"
  CARGO_INCREMENTAL: "0"

jobs:
  gate-script:
    name: T2 gate script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate script pass/fail fixtures
        run: bash scripts/redteam-t2-gate.test.sh

  t2:
    name: T2 live deployment
    if: github.event_name != 'pull_request' && vars.REDTEAM_T2_ENABLED == 'true'
    runs-on: ${{ vars.REDTEAM_T2_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: false

      - name: Build the redteam runner
        run: cargo build --locked -p cctui-redteam

      - name: Write the operator config
        env:
          T2_CONFIG_JSON: ${{ secrets.REDTEAM_T2_CONFIG }}
        run: |
          umask 077
          printf '%s' "$T2_CONFIG_JSON" > "$RUNNER_TEMP/t2-config.json"
          jq -e . "$RUNNER_TEMP/t2-config.json" > /dev/null

      - name: T2 probes in every valid cell
        env:
          REDTEAM_T2_CONFIG: ${{ runner.temp }}/t2-config.json
          REDTEAM_T2_TOKEN: ${{ secrets.REDTEAM_T2_TOKEN }}
          REDTEAM_BIN: ${{ github.workspace }}/target/debug/cctui-redteam
          REDTEAM_T2_EXPECT_VERSION: ${{ inputs.expect_version }}
          REDTEAM_T2_KEEP_DIR: ${{ vars.REDTEAM_T2_KEEP_DIR }}
        run: bash redteam/ci/run-t2.sh "$RUNNER_TEMP/redteam-t2"

      - name: Name the gate record by version
        id: record
        if: always()
        run: |
          gate_file="$RUNNER_TEMP/redteam-t2/t2-gate.json"
          ver="$(jq -r '.version // "unknown"' "$gate_file" 2>/dev/null || echo unknown)"
          echo "version=${ver:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: redteam-t2-${{ steps.record.outputs.version }}
          path: ${{ runner.temp }}/redteam-t2/t2-gate.json
          retention-days: 30
          if-no-files-found: ignore
