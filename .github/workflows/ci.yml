name: ci

on:
  pull_request: {}
  # Version branches too: release.yml refuses to publish a tag whose commit has
  # no green ci run, and a tag push does not trigger ci.yml.
  push:
    branches: [main, "0.*", "1.*", "release/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled push run leaves its commit without the green run release.yml requires.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"
  # rust-cache keys are prefix + toolchain/env hash + manifest/lockfile hash.
  # The hash covers every installed toolchain, so jobs uninstall all but
  # RUST_VERSION first or each runner image update would cold-start the cache.
  # The workspace version is normalized out of that hash, so a release bump
  # keeps the key; a dependency change misses it, and the prefix fallback still
  # restores the previous deps (`full match: false`).
  # Save only where later runs can read the cache: main and version branches,
  # never PRs or tags. Must not start with RUST/CARGO/CC: those are hashed.
  SAVE_RUST_CACHE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/0.') || startsWith(github.ref, 'refs/heads/1.') || startsWith(github.ref, 'refs/heads/release/')) }}
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      webui: ${{ steps.scope.outputs.webui }}
      deps: ${{ steps.scope.outputs.deps }}
      deploy: ${{ steps.scope.outputs.deploy }}
      # false when a green run already tested this exact tree, e.g. the push
      # of a squash merge whose pull request run passed.
      check: ${{ steps.tested.outputs.check != 'false' }}
      # A skipped push still builds what clippy, test and bindings cache when
      # their key has no exact match, so pull requests into the branch restore it.
      warm: ${{ steps.tested.outputs.check == 'false' && env.SAVE_RUST_CACHE == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Scope the run to the diff
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          if [ -n "$base" ]; then
            out="$(bash scripts/ci-changes.sh "$base" HEAD)"
          else
            out="$(bash scripts/ci-changes.sh --all)"
          fi
          if grep -qx 'ci=true' <<<"$out"; then
            out="$(bash scripts/ci-changes.sh --all)"
          fi
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Skip checks a green run already passed on this tree
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.scope.outputs.tree }}
        run: |
          if url="$(bash scripts/ci-tested-tree.sh "$GITHUB_REPOSITORY" "$TREE" "$GITHUB_RUN_ID")"; then
            echo "tree $TREE already passed: $url"
            echo "check=false" >> "$GITHUB_OUTPUT"
          fi

      # check-ci-green.sh and later runs find this run by the tree it tested.
      - name: Name the tested tree
        if: steps.tested.outputs.check != 'false'
        run: echo "${{ steps.scope.outputs.tree }}" > "$RUNNER_TEMP/ci-tree"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.tested.outputs.check != 'false'
        with:
          name: ci-tree-${{ steps.scope.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree
          retention-days: 7
          overwrite: true

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustfmt.toml enables unstable options, so formatting is nightly-only.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --all --check

  biome:
    name: biome
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Root config: formats the data/docs files, linter off. Source linting runs
      # per project (see the webui job).
      - name: biome check
        run: npx --yes @biomejs/biome@2.5.6 check .

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.check == 'true' || needs.changes.outputs.warm == 'true')
    runs-on: ubuntu-latest
    env:
      WARM_ONLY: ${{ needs.changes.outputs.check != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        id: cached
        if: env.WARM_ONLY == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: cargo clippy
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Core library builds independently of workspace services
        run: cargo check -p cctui-server-core --all-targets --locked

  test:
    name: cargo test
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.check == 'true' || needs.changes.outputs.warm == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cctui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cctui_test
      CCTUI_ADMIN_TOKENS: test-admin
      CCTUI_VAULT_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      TEST_CCTUI_URL: http://localhost:8700
      TEST_ADMIN_TOKEN: test-admin
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      WARM_ONLY: ${{ needs.changes.outputs.check != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        id: cached
        if: env.WARM_ONLY == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install sqlx-cli
        if: steps.cached.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: sqlx-cli

      - name: Apply migrations
        if: steps.cached.outputs.cache-hit != 'true'
        run: sqlx migrate run --source migrations

      - name: cargo test --no-run (warm the cache)
        if: env.WARM_ONLY == 'true' && steps.cached.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --no-run

      # Every cargo test below keeps the same --workspace package selection so
      # feature unification (and therefore the compiled artifacts) is identical
      # and the workspace compiles once.
      - name: cargo test (workspace)
        if: env.WARM_ONLY != 'true'
        run: cargo test --workspace --locked

      # Ignored tests that only need the CI database or a throwaway runner. The
      # rest need a live claude/codex/opencode binary and stay manual-only.
      - name: cargo test --ignored (database, fake harness shims)
        if: env.WARM_ONLY != 'true'
        run: |
          cargo test --workspace --locked --bins --lib -- --ignored routes::gateway::mint::db_tests harness_update::

      # `cargo test --workspace` already linked target/debug/cctui-server for the
      # integration test target; do not rebuild it with a different package
      # selection.
      - name: Start the server
        if: env.WARM_ONLY != 'true'
        run: |
          test -x ./target/debug/cctui-server || { echo "cargo test did not produce target/debug/cctui-server" >&2; exit 1; }
          ./target/debug/cctui-server > /tmp/cctui-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8700/health >/dev/null 2>&1; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat /tmp/cctui-server.log >&2
          exit 1

      - name: cargo test --ignored (against the running server)
        if: env.WARM_ONLY != 'true'
        run: cargo test --workspace --locked --test integration -- --ignored

      - name: Server log
        if: always() && env.WARM_ONLY != 'true'
        run: cat /tmp/cctui-server.log 2>/dev/null || true

  bindings:
    name: webui bindings
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.check == 'true' || needs.changes.outputs.warm == 'true')
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      WARM_ONLY: ${{ needs.changes.outputs.check != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        id: cached
        if: env.WARM_ONLY == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # cctui-query's ts exports are not part of the webui bindings.
      - name: Regenerate webui bindings
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          CCTUI_BINDINGS_CARGO_ARGS: --workspace --locked --lib --bins --exclude cctui-query
        run: |
          bash webui/scripts/gen-bindings.sh
          node webui/scripts/gen-scrub-detectors.mjs

      - name: Committed bindings match the generators
        if: env.WARM_ONLY != 'true'
        run: |
          git add --intent-to-add webui/src/lib/bindings
          if ! git diff --exit-code webui/src/lib/bindings webui/src/lib/scrubDetectors.generated.ts; then
            echo "::error::webui bindings are stale. Run 'make bindings' and commit the result."
            exit 1
          fi

  release-scope:
    name: release scope
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Would a release of this commit rebuild Rust
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CCTUI_RELEASED_TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --exclude-drafts --json tagName --jq '.[].tagName' | tr '\n' ' ')"
          export CCTUI_RELEASED_TAGS
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          out="$(bash scripts/release-scope.sh "v$version" "$(git rev-parse HEAD)")"
          echo "$out"
          grep '^rust=' <<<"$out" >> "$GITHUB_OUTPUT"

  release-cache:
    name: warm release cache ${{ matrix.target }}
    needs: release-scope
    if: needs.release-scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-zigbuild

      - name: Build release binaries
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/release-build-bins.sh "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.target }}"

      # release.yml takes these instead of rebuilding when this commit is tagged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bins-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/cctui-${{ matrix.os }}-${{ matrix.arch }}
            dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.arch == 'amd64'
        with:
          name: release-image-bins
          retention-days: 1
          path: image-bins/


  release-cache-server:
    name: warm release cache cctui-server
    needs: release-scope
    if: needs.release-scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-server
          save-if: ${{ env.SAVE_RUST_CACHE }}
      - name: Build cctui-server for the image
        env:
          SQLX_OFFLINE: "true"
          CCTUI_GIT_HASH: ${{ github.sha }}
        run: bash scripts/release-build-server.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-bins-server
          retention-days: 1
          path: image-bins/

  webui:
    name: webui check
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Lint
        working-directory: webui
        run: npm run lint

      - name: Check
        working-directory: webui
        run: npm run check

  webui-test:
    name: webui test ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Test
        working-directory: webui
        run: npm test -- --shard=${{ matrix.shard }}/3

  webui-build:
    name: webui build
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Build
        working-directory: webui
        run: npm run build

      # The TUI replays the exported IR, which cargo cannot compile from the specs.
      - name: Journey IR is in step with the specs
        working-directory: webui
        run: |
          npm run journey:ir
          git diff --exit-code -- ../docs/journeys || {
            echo "docs/journeys/*/ir.json is stale: run 'npm run journey:ir' in webui and commit it" >&2
            exit 1
          }

  e2e:
    name: webui e2e (hermetic) ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' webui/package-lock.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: webui
        run: npx playwright install --with-deps chromium

      - name: Install chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: webui
        run: npx playwright install-deps chromium

      # These projects stub every request; no server, no seeded database, no
      # journeys/.auth/state.json. The other projects need the local stack.
      - name: Playwright
        working-directory: webui
        env:
          HEADER_E2E_PORT: "5291"
        run: npx playwright test --project hermetic --project drawer --project drawer-header --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: webui/test-results/

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit

      - name: Ignored advisories are still unreachable
        run: |
          if cargo tree --workspace --all-features --target all -i rsa 2>/dev/null | grep -q '^rsa v'; then
            echo "rsa is in the build graph; drop the RUSTSEC-2023-0071 ignore in .cargo/audit.toml" >&2
            exit 1
          fi

      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci --ignore-scripts

      - name: npm audit (webui)
        working-directory: webui
        continue-on-error: true
        run: npm audit --audit-level=high

  no-css-global:
    name: no-css-global
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/no-css-global.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject new :global(...) overrides in webui Svelte files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head^"
          fi
          bash scripts/no-css-global.sh "$base...$head"

  comment-refs:
    name: comment-refs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/check-comment-refs.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject ticket references in added comments
        run: bash scripts/check-comment-refs.sh "origin/${{ github.base_ref }}"

  forbidden-terms:
    name: forbidden-terms
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/check-forbidden-terms.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      # Fork and bot PRs get no secrets, so an empty list skips.
      - name: Reject private names in the PR's diffs and commit messages
        env:
          TERM_LIST: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$TERM_LIST" ]; then
            echo "::notice::FORBIDDEN_TERMS is not set; skipping"
            exit 0
          fi
          list="$RUNNER_TEMP/forbidden-terms.txt"
          printf '%s\n' "$TERM_LIST" >"$list"
          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            [ -n "$entry" ] || continue
            echo "::add-mask::$entry"
            case "$entry" in re:* | lit:*) echo "::add-mask::${entry#*:}" ;; esac
          done <"$list"
          bash scripts/check-forbidden-terms.sh --patterns "$list" --range "origin/$BASE_REF..HEAD"

  i18n-messages:
    name: i18n-messages
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject i18n sentence fragments and locale key drift
        run: bash scripts/check-i18n.test.sh

  release-channel:
    name: release-channel
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Map release tags to channels
        run: bash scripts/release-channel.test.sh

      - name: A release tag must equal the workspace version
        run: bash scripts/release-version.test.sh

      - name: The release gate refuses a commit without a green run
        run: bash scripts/check-ci-green.test.sh

      - name: Path scoping classifies changes
        run: bash scripts/ci-changes.test.sh

      - name: Release scoping picks what to rebuild
        run: bash scripts/release-scope.test.sh

      - name: The release takes push CI's binaries or builds its own
        run: bash scripts/release-ci-bins.test.sh

      - name: Path scoping tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

  local-seed:
    name: local-seed
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The fixture seeds only the stack this checkout started
        run: bash deploy/local/fixture/seed.test.sh

  deploy-tests:
    name: deploy tests
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dash

      # The worker image runs these with Debian's /bin/sh, which is dash.
      - name: Container scripts parse under dash
        run: |
          for f in deploy/*.sh; do
            echo "dash -n $f"
            dash -n "$f"
          done

      - name: Every deploy/tests suite passes
        run: |
          failed=()
          for t in deploy/tests/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            exit 1
          fi

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: actionlint
        run: ./actionlint -color

  # The single required check for branch protection: skipped jobs count as
  # passing, failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - fmt
      - biome
      - clippy
      - test
      - bindings
      - release-scope
      - release-cache
      - release-cache-server
      - webui
      - webui-test
      - webui-build
      - e2e
      - audit
      - no-css-global
      - comment-refs
      - forbidden-terms
      - i18n-messages
      - release-channel
      - local-seed
      - deploy-tests
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
