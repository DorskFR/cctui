name: ci

on:
  pull_request:
    # labeled: adding run-e2e reruns the checks with the e2e job.
    types: [opened, synchronize, reopened, labeled]
  # Version branches too: release.yml refuses to publish a tag whose commit has
  # no green ci run, and a tag push does not trigger ci.yml.
  push:
    branches: [main, "0.*", "1.*", "release/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled push run leaves its commit without the green run release.yml requires.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"
  # rust-cache keys are prefix + toolchain/env hash + manifest/lockfile hash.
  # The hash covers every installed toolchain, so jobs uninstall all but
  # RUST_VERSION first or each runner image update would cold-start the cache.
  # The workspace version is normalized out of that hash, so a release bump
  # keeps the key; a dependency change misses it, and the prefix fallback still
  # restores the previous deps (`full match: false`).
  # Save only where later runs can read the cache: main and version branches,
  # never PRs or tags. Must not start with RUST/CARGO/CC: those are hashed.
  SAVE_RUST_CACHE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/0.') || startsWith(github.ref, 'refs/heads/1.') || startsWith(github.ref, 'refs/heads/release/')) }}
  # Releases are tagged on version branches, whose pushes build the binaries a
  # release takes over; main keeps only the caches its own checks use.
  SAVE_RELEASE_CACHE: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/heads/0.') || startsWith(github.ref, 'refs/heads/1.') || startsWith(github.ref, 'refs/heads/release/')) }}
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      webui: ${{ steps.scope.outputs.webui }}
      deps: ${{ steps.scope.outputs.deps }}
      deploy: ${{ steps.scope.outputs.deploy }}
      worker: ${{ steps.scope.outputs.worker }}
      e2e: ${{ steps.scope.outputs.e2e }}
      playwright: ${{ steps.scope.outputs.playwright }}
      crates: ${{ steps.crates.outputs.crates }}
      save: ${{ env.SAVE_RUST_CACHE }}
      # false when a green run already tested this exact tree, e.g. the push
      # of a squash merge whose pull request run passed.
      check: ${{ steps.tested.outputs.check != 'false' }}
      # A skipped push still builds what clippy and test cache when their key
      # has no exact match, so pull requests into the branch restore it.
      warm: ${{ steps.tested.outputs.check == 'false' && env.SAVE_RUST_CACHE == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Scope the run to the diff
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
                && git fetch -q --no-tags --depth=1 origin "$BEFORE"; then
                base="$BEFORE"
              fi
              ;;
          esac
          if [ -n "$base" ]; then
            out="$(bash scripts/ci-changes.sh "$base" HEAD)"
          else
            out="$(bash scripts/ci-changes.sh --all)"
          fi
          if grep -qx 'ci=true' <<<"$out"; then
            out="$(bash scripts/ci-changes.sh --all)"
          fi
          echo "$out"
          {
            echo "$out"
            echo "base=$base"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "playwright=$(jq -r '.packages["node_modules/@playwright/test"].version' webui/package-lock.json)"
          } >> "$GITHUB_OUTPUT"

      # Pull requests test the crates they change and their dependents. Pushes
      # test everything: they save the caches and gate the release.
      - name: Crates to test
        id: crates
        if: steps.scope.outputs.rust == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.scope.outputs.base }}
          WHOLE: ${{ steps.scope.outputs.ci }}
          # Skips installing the pinned toolchain: cargo metadata --no-deps only.
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [ "$EVENT" = pull_request ] && [ -n "$BASE" ] && [ "$WHOLE" != true ]; then
            crates="$(bash scripts/affected-crates.sh "$BASE" HEAD | tr '\n' ' ')"
          else
            crates="$(bash scripts/affected-crates.sh --all | tr '\n' ' ')"
          fi
          echo "crates: ${crates:-none}"
          echo "crates=${crates% }" >> "$GITHUB_OUTPUT"

      - name: Skip checks a green run already passed on this tree
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.scope.outputs.tree }}
        run: |
          if url="$(bash scripts/ci-tested-tree.sh "$GITHUB_REPOSITORY" "$TREE" "$GITHUB_RUN_ID")"; then
            echo "tree $TREE already passed: $url"
            echo "check=false" >> "$GITHUB_OUTPUT"
          fi

      # check-ci-green.sh and later runs find this run by the tree it tested.
      - name: Name the tested tree
        if: steps.tested.outputs.check != 'false'
        run: echo "${{ steps.scope.outputs.tree }}" > "$RUNNER_TEMP/ci-tree"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.tested.outputs.check != 'false'
        with:
          name: ci-tree-${{ steps.scope.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree
          retention-days: 7
          overwrite: true

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustfmt.toml enables unstable options, so formatting is nightly-only.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --all --check

  biome:
    name: biome
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Root config: formats the data/docs files, linter off. Source linting runs
      # per project (see the webui job).
      - name: biome check
        run: npx --yes @biomejs/biome@2.5.6 check .

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.check == 'true' || needs.changes.outputs.warm == 'true')
    runs-on: ubuntu-latest
    env:
      WARM_ONLY: ${{ needs.changes.outputs.check != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        id: cached
        if: env.WARM_ONLY == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Always the whole workspace: a -p selection changes dependency features
      # and recompiles them past the cache.
      - name: cargo clippy
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

      - name: Kernel builds independently of every other server crate
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-kernel ')
        run: cargo check -p cctui-server-kernel --all-targets --locked

      - name: Search builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-search ')
        run: cargo check -p cctui-server-search --all-targets --locked

      - name: Blobs builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-blobs ')
        run: cargo check -p cctui-server-blobs --all-targets --locked

      - name: Voice builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-voice ')
        run: cargo check -p cctui-server-voice --all-targets --locked

      - name: Extras builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-extras ')
        run: cargo check -p cctui-server-extras --all-targets --locked

      - name: Accounts builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-accounts ')
        run: cargo check -p cctui-server-accounts --all-targets --locked

      - name: Dispatch builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-dispatch ')
        run: cargo check -p cctui-server-dispatch --all-targets --locked

      - name: Notify builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-notify ')
        run: cargo check -p cctui-server-notify --all-targets --locked

      - name: Sessions builds on the kernel alone
        if: env.WARM_ONLY != 'true' && contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server-sessions ')
        run: cargo check -p cctui-server-sessions --all-targets --locked

  test:
    name: cargo test
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (needs.changes.outputs.check == 'true' || needs.changes.outputs.warm == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cctui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cctui_test
      CCTUI_ADMIN_TOKENS: test-admin
      CCTUI_VAULT_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      TEST_CCTUI_URL: http://localhost:8700
      TEST_ADMIN_TOKEN: test-admin
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      WARM_ONLY: ${{ needs.changes.outputs.check != 'true' }}
      AFFECTED_CRATES: ${{ needs.changes.outputs.crates }}
      SERVER_AFFECTED: ${{ contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-server ') }}
      BINDINGS_AFFECTED: ${{ contains(format(' {0} ', needs.changes.outputs.crates), ' cctui-proto ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        id: cached
        if: env.WARM_ONLY == 'true'
        with:
          lookup-only: true
          save-if: false
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # The one compile of the job: every cargo test below keeps the --workspace
      # selection, so feature unification and the artifacts stay identical.
      # affected-crates.sh runs a subset of these binaries without rebuilding.
      - name: cargo test --no-run
        if: steps.cached.outputs.cache-hit != 'true'
        run: cargo test --workspace --locked --no-run

      - name: Provision the test database
        if: env.WARM_ONLY != 'true'
        run: ./target/debug/cctui-server init-db

      - name: cargo test (affected crates)
        if: env.WARM_ONLY != 'true'
        run: |
          read -ra pkgs <<<"$AFFECTED_CRATES"
          bash scripts/affected-crates.sh test "${pkgs[@]}" -- --locked

      # Ignored tests that only need the CI database or a throwaway runner. The
      # rest need a live claude/codex/opencode binary and stay manual-only.
      - name: cargo test --ignored (database, fake harness shims)
        if: env.WARM_ONLY != 'true'
        run: |
          read -ra pkgs <<<"$AFFECTED_CRATES"
          bash scripts/affected-crates.sh test "${pkgs[@]}" -- --locked --bins --lib \
            -- --ignored routes::gateway::mint::db_tests harness_update::

      - name: Start the server
        if: env.WARM_ONLY != 'true' && env.SERVER_AFFECTED == 'true'
        run: |
          test -x ./target/debug/cctui-server || { echo "cargo test did not produce target/debug/cctui-server" >&2; exit 1; }
          ./target/debug/cctui-server > /tmp/cctui-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8700/health >/dev/null 2>&1; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat /tmp/cctui-server.log >&2
          exit 1

      - name: cargo test --ignored (against the running server)
        if: env.WARM_ONLY != 'true'
        run: |
          read -ra pkgs <<<"$AFFECTED_CRATES"
          bash scripts/affected-crates.sh test "${pkgs[@]}" -- --locked --test integration -- --ignored

      - name: Server log
        if: always() && env.WARM_ONLY != 'true' && env.SERVER_AFFECTED == 'true'
        run: cat /tmp/cctui-server.log 2>/dev/null || true

      # Reuses the build above: the ts-rs exports are cctui-proto test targets.
      - name: Regenerate webui bindings
        if: env.WARM_ONLY != 'true' && env.BINDINGS_AFFECTED == 'true'
        env:
          CCTUI_BINDINGS_CARGO_ARGS: --workspace --locked --lib
        run: bash webui/scripts/gen-bindings.sh

      - name: Committed bindings match the generators
        if: env.WARM_ONLY != 'true'
        run: |
          node webui/scripts/gen-scrub-detectors.mjs
          git add --intent-to-add webui/src/lib/bindings
          if ! git diff --exit-code webui/src/lib/bindings webui/src/lib/scrubDetectors.generated.ts; then
            echo "::error::webui bindings are stale. Run 'make bindings' and commit the result."
            exit 1
          fi

  release-scope:
    name: release scope
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Would a release of this commit rebuild Rust
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CCTUI_RELEASED_TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --exclude-drafts --json tagName --jq '.[].tagName' | tr '\n' ' ')"
          export CCTUI_RELEASED_TAGS
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          out="$(bash scripts/release-scope.sh "v$version" "$(git rev-parse HEAD)")"
          echo "$out"
          grep '^rust=' <<<"$out" >> "$GITHUB_OUTPUT"

  release-cache:
    name: warm release cache ${{ matrix.target }}
    needs: release-scope
    if: needs.release-scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ env.SAVE_RELEASE_CACHE }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild

      - name: Build release binaries
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/release-build-bins.sh "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.target }}"

      # release.yml takes these instead of rebuilding when this commit is tagged.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bins-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/cctui-${{ matrix.os }}-${{ matrix.arch }}
            dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.arch == 'amd64'
        with:
          name: release-image-bins
          retention-days: 1
          path: image-bins/


  release-cache-server:
    name: warm release cache cctui-server
    needs: release-scope
    if: needs.release-scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: release-server
          save-if: ${{ env.SAVE_RELEASE_CACHE }}
      - name: Build cctui-server for the image
        env:
          SQLX_OFFLINE: "true"
          CCTUI_GIT_HASH: ${{ github.sha }}
        run: bash scripts/release-build-server.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-bins-server
          retention-days: 1
          path: image-bins/

  webui:
    name: webui check
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Lint
        working-directory: webui
        run: npm run lint

      - name: Check
        working-directory: webui
        run: npm run check

  webui-test:
    name: webui test ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Test
        working-directory: webui
        run: npm test -- --shard=${{ matrix.shard }}/3

  webui-build:
    name: webui build
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Build
        working-directory: webui
        run: npm run build

      # The TUI replays the exported IR, which cargo cannot compile from the specs.
      - name: Journey IR is in step with the specs
        working-directory: webui
        run: |
          npm run journey:ir
          git diff --exit-code -- ../docs/journeys || {
            echo "docs/journeys/*/ir.json is stale: run 'npm run journey:ir' in webui and commit it" >&2
            exit 1
          }

  # ci-changes.sh sets e2e when a spec, its fixtures or the build change, or a
  # webui/src path names a spec's area.
  e2e:
    name: webui e2e (hermetic; on e2e-area changes or the run-e2e label) ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.check == 'true' && (needs.changes.outputs.e2e == 'true' || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/webui-deps

      - name: Build
        working-directory: webui
        run: npm run build

      # These projects stub every request; no server, no seeded database, no
      # journeys/.auth/state.json. The other projects need the local stack.
      - name: Playwright
        working-directory: webui
        env:
          HEADER_E2E_PORT: "5291"
        run: npx playwright test --project hermetic --project drawer --project drawer-header --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: ignore
          path: webui/test-results/

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Keep only the pinned toolchain
        run: rustup toolchain list --quiet | awk -v pinned="$RUST_VERSION" '$1 != pinned && index($1, pinned "-") != 1 { print $1 }' | while read -r tc; do rustup toolchain uninstall "$tc"; done
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit

      - name: Ignored advisories are still unreachable
        run: |
          for crate in libsqlite3-sys; do
            if cargo tree --workspace --all-features --target all -i "$crate" 2>/dev/null | grep -q "^$crate v"; then
              echo "$crate is in the build graph; drop its ignore in .cargo/audit.toml" >&2
              exit 1
            fi
          done

      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci --ignore-scripts

      - name: npm audit (webui)
        working-directory: webui
        continue-on-error: true
        run: npm audit --audit-level=high

  no-css-global:
    name: no-css-global
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/no-css-global.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject new :global(...) overrides in webui Svelte files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head^"
          fi
          bash scripts/no-css-global.sh "$base...$head"
          bash scripts/no-native-confirm.test.sh && bash scripts/no-native-confirm.sh "$base...$head"

  comment-refs:
    name: comment-refs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/check-comment-refs.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject ticket references in added comments
        run: bash scripts/check-comment-refs.sh "origin/${{ github.base_ref }}"

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the guard itself
        run: bash scripts/check-migrations.test.sh

      - name: Reject legacy additions and package version collisions
        run: bash scripts/check-migrations.sh

  forbidden-terms:
    name: forbidden-terms
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/check-forbidden-terms.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      # Fork and bot PRs get no secrets, so an empty list skips.
      - name: Reject private names in the PR's diffs and commit messages
        env:
          TERM_LIST: ${{ secrets.FORBIDDEN_TERMS }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$TERM_LIST" ]; then
            echo "::notice::FORBIDDEN_TERMS is not set; skipping"
            exit 0
          fi
          list="$RUNNER_TEMP/forbidden-terms.txt"
          printf '%s\n' "$TERM_LIST" >"$list"
          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            [ -n "$entry" ] || continue
            echo "::add-mask::$entry"
            case "$entry" in re:* | lit:*) echo "::add-mask::${entry#*:}" ;; esac
          done <"$list"
          bash scripts/check-forbidden-terms.sh --patterns "$list" --range "origin/$BASE_REF..HEAD"

  i18n-messages:
    name: i18n-messages
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject i18n sentence fragments and locale key drift
        run: bash scripts/check-i18n.test.sh

  release-channel:
    name: release-channel
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Map release tags to channels
        run: bash scripts/release-channel.test.sh

      - name: A release tag must equal the workspace version
        run: bash scripts/release-version.test.sh

      - name: The release gate refuses a commit without a green run
        run: bash scripts/check-ci-green.test.sh

      - name: Path scoping classifies changes
        run: bash scripts/ci-changes.test.sh

      - name: Crate scoping follows dependents and runs only their tests
        run: bash scripts/affected-crates.test.sh

      - name: The heavy wrapper caps local runs and stays out of CI's way
        run: bash scripts/heavy.test.sh

      - name: Release scoping picks what to rebuild
        run: bash scripts/release-scope.test.sh

      - name: Release packaging stages every distribution and target
        run: bash scripts/release-build-bins.test.sh

      - name: The release takes push CI's binaries or builds its own
        run: bash scripts/release-ci-bins.test.sh

      - name: Darwin binaries get a pinned Mach-O UUID
        run: bash scripts/pin-macho-uuid.test.sh

      - name: Path scoping tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

  local-seed:
    name: local-seed
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The fixture seeds only the stack this checkout started
        run: bash deploy/local/fixture/seed.test.sh

  deploy-tests:
    name: deploy tests
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends dash

      # The worker image runs these with Debian's /bin/sh, which is dash.
      - name: Container scripts parse under dash
        run: |
          for f in deploy/*.sh; do
            echo "dash -n $f"
            dash -n "$f"
          done

      - name: Every deploy/tests suite passes
        run: |
          failed=()
          for t in deploy/tests/test-*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}" >&2
            exit 1
          fi

  # The base is built on stub cctui binaries: the sample only adds agents. The
  # default docker driver (no setup-buildx) lets the sample's FROM resolve the
  # local base image.
  worker-agents:
    name: worker agents sample (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.check == 'true' && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all
            args: WITH_CLAUDE=1 WITH_CODEX=1 WITH_OPENCODE=1 WITH_ACP_AGENTS=1 WITH_GOOSE=1 WITH_TOOLS=1
          - name: defaults
            args: ""
          - name: none
            args: WITH_CLAUDE=0 WITH_CODEX=0 WITH_OPENCODE=0 WITH_ACP_AGENTS=0 WITH_GOOSE=0 WITH_TOOLS=0
          - name: claude
            args: WITH_CLAUDE=1 WITH_CODEX=0 WITH_TOOLS=0
          - name: codex
            args: WITH_CLAUDE=0 WITH_CODEX=1 WITH_TOOLS=0
          - name: opencode
            args: WITH_CLAUDE=0 WITH_CODEX=0 WITH_OPENCODE=1 WITH_TOOLS=0
          - name: acp-agents
            args: WITH_CLAUDE=0 WITH_CODEX=0 WITH_ACP_AGENTS=1 WITH_TOOLS=0
          - name: goose
            args: WITH_CLAUDE=0 WITH_CODEX=0 WITH_GOOSE=1 WITH_TOOLS=0
          - name: tools
            args: WITH_CLAUDE=0 WITH_CODEX=0 WITH_TOOLS=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the barebone worker on stub binaries
        run: |
          bins="$RUNNER_TEMP/stub-bins"
          mkdir -p "$bins"
          for b in cctui-daemon cctui-guard-proxy cctui-supervisor cctui-guard; do
            printf '#!/bin/sh\nexit 0\n' > "$bins/$b"
            chmod 0755 "$bins/$b"
          done
          docker build -f deploy/worker.Dockerfile --build-context "bins=$bins" -t cctui-worker:ci .

      - name: Build the sample
        env:
          ARGS: ${{ matrix.args }}
        run: |
          flags=(--build-arg BASE_IMAGE=cctui-worker:ci)
          for a in $ARGS; do flags+=(--build-arg "$a"); done
          docker build "${flags[@]}" -t cctui-worker-agents:ci deploy/examples/worker-agents

      - name: Verify harness version floors
        if: matrix.name == 'all'
        run: bash scripts/check-worker-image-harness.sh cctui-worker-agents:ci

      - name: An agent-less worker refuses to boot
        if: matrix.name == 'none'
        run: |
          set +e
          out="$(timeout 60 docker run --rm -e CCTUI_URL=http://cctui.invalid -e CCTUI_MACHINE_KEY=k \
            -e SESSION_ID=00000000-0000-4000-8000-000000000000 cctui-worker-agents:ci 2>&1)"
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::exit 0 without an agent"; exit 1; }
          grep -qF 'no agent CLI installed in this image' <<<"$out" \
            || { echo "::error::no warning printed"; exit 1; }

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: actionlint
        run: ./actionlint -color

  # rust-cache and setup-zig save a new entry per lock hash or run, and tag
  # runs' buildkit caches are only readable by that tag: keep the newest entry
  # per kind on this branch and the latest tag's. Never fails the run, which
  # check-ci-green.sh requires to succeed.
  cache-prune:
    name: prune superseded caches
    needs: [changes, clippy, test, audit, release-cache, release-cache-server, webui, webui-test, webui-build, e2e]
    if: always() && needs.changes.outputs.save == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref,createdAt,sizeInBytes >caches.json
          jq -r --arg ref "$REF" '
            def kind: .key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; "") | sub("--[0-9]+-[0-9]+$"; "") | sub("-v[0-9.]+-[0-9a-f]{32}$"; "");
            (map(select(.ref == $ref and (.key | test("^(v0-rust-|setup-zig-cache-|webui-node_modules-)"))))
              | group_by(kind) | map(sort_by(.createdAt) | .[:-1][])),
            (map(select(.ref | contains("refs/tags/"))) as $tags
              | if ($tags | length) == 0 then [] else
                  ($tags | max_by(.createdAt) | .ref) as $latest | $tags | map(select(.ref != $latest))
                end)
            | .[] | "\(.id)\t\(.sizeInBytes)\t\(.ref)\t\(.key)"' caches.json >stale.tsv
          freed=0
          while IFS=$'\t' read -r id size ref key; do
            if gh cache delete --repo "$GITHUB_REPOSITORY" "$id" >/dev/null; then
              echo "deleted $key ($ref, $((size / 1000000)) MB)"
              freed=$((freed + size))
            fi
          done <stale.tsv
          echo "freed $((freed / 1000000)) MB"

  # The single required check for branch protection: skipped jobs count as
  # passing, failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - fmt
      - biome
      - clippy
      - test
      - release-scope
      - release-cache
      - release-cache-server
      - webui
      - webui-test
      - webui-build
      - e2e
      - audit
      - no-css-global
      - comment-refs
      - migrations
      - forbidden-terms
      - i18n-messages
      - release-channel
      - local-seed
      - deploy-tests
      - worker-agents
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
