name: ci

on:
  pull_request: {}
  # Version branches too: release.yml refuses to publish a tag whose commit has
  # no green ci run, and a tag push does not trigger ci.yml.
  push:
    branches: [main, "0.*", "1.*", "release/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled push run leaves its commit without the green run release.yml requires.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      webui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.webui == 'true' }}
      deps: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - crates/**
              - docs/journeys/**
              - migrations/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - rustfmt.toml
              - .cargo/**
            webui:
              - *ci
              - webui/**
            deps:
              - *ci
              - Cargo.lock
              - .cargo/**
              - webui/package-lock.json

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustfmt.toml enables unstable options, so formatting is nightly-only.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --all --check

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Root config: formats the data/docs files, linter off. Source linting runs
      # per project (see the webui job).
      - name: biome check
        run: npx --yes @biomejs/biome@2.5.6 check .

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cctui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cctui_test
      CCTUI_ADMIN_TOKENS: test-admin
      CCTUI_VAULT_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      TEST_CCTUI_URL: http://localhost:8700
      TEST_ADMIN_TOKEN: test-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install sqlx-cli
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: sqlx-cli

      - name: Apply migrations
        run: sqlx migrate run --source migrations

      # Every cargo test below keeps the same --workspace package selection so
      # feature unification (and therefore the compiled artifacts) is identical
      # and the workspace compiles once.
      - name: cargo test (workspace)
        run: cargo test --workspace --locked

      # Ignored tests that only need the CI database or a throwaway runner. The
      # rest need a live claude/codex/opencode binary and stay manual-only.
      - name: cargo test --ignored (database, fake harness shims)
        run: |
          cargo test --workspace --locked --bins --lib -- --ignored routes::gateway::mint::db_tests harness_update::

      # `cargo test --workspace` already linked target/debug/cctui-server for the
      # integration test target; do not rebuild it with a different package
      # selection.
      - name: Start the server
        run: |
          test -x ./target/debug/cctui-server || { echo "cargo test did not produce target/debug/cctui-server" >&2; exit 1; }
          ./target/debug/cctui-server > /tmp/cctui-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8700/health >/dev/null 2>&1; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat /tmp/cctui-server.log >&2
          exit 1

      - name: cargo test --ignored (against the running server)
        run: cargo test --workspace --locked --test integration -- --ignored

      # Same --workspace selection as the tests above, minus cctui-query, whose
      # ts exports are not part of the webui bindings. The `ts` feature is only
      # enabled here, so this step recompiles the exporting crates.
      - name: Regenerate webui bindings
        env:
          CCTUI_BINDINGS_CARGO_ARGS: --workspace --locked --lib --bins --exclude cctui-query
        run: |
          bash webui/scripts/gen-bindings.sh
          node webui/scripts/gen-scrub-detectors.mjs

      - name: Committed bindings match the generators
        run: |
          git add --intent-to-add webui/src/lib/bindings
          if ! git diff --exit-code webui/src/lib/bindings webui/src/lib/scrubDetectors.generated.ts; then
            echo "::error::webui bindings are stale. Run 'make bindings' and commit the result."
            exit 1
          fi

      - name: Server log
        if: always()
        run: cat /tmp/cctui-server.log 2>/dev/null || true

  # Warms the Swatinem/rust-cache keys release.yml restores (tag refs can only
  # read caches saved on the default branch). Main pushes only; a cold run is
  # about the length of the test job, a warm one is incremental.
  release-cache:
    name: warm release cache ${{ matrix.target }}
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-zigbuild

      - name: Build release binaries
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/release-build-bins.sh "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.target }}"


  release-cache-server:
    name: warm release cache cctui-server
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-server
      - name: Build cctui-server for the image
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/release-build-server.sh

  webui:
    name: webui
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Lint
        working-directory: webui
        run: npm run lint

      - name: Check
        working-directory: webui
        run: npm run check

      - name: Test
        working-directory: webui
        run: npm test

      - name: Build
        working-directory: webui
        run: npm run build

      # The TUI replays the exported IR, which cargo cannot compile from the specs.
      - name: Journey IR is in step with the specs
        working-directory: webui
        run: |
          npm run journey:ir
          git diff --exit-code -- ../docs/journeys || {
            echo "docs/journeys/*/ir.json is stale: run 'npm run journey:ir' in webui and commit it" >&2
            exit 1
          }

  e2e:
    name: webui e2e (hermetic)
    needs: changes
    if: needs.changes.outputs.webui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        working-directory: webui
        run: npm ci

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Install chromium
        working-directory: webui
        run: npx playwright install --with-deps chromium

      # These projects stub every request; no server, no seeded database, no
      # journeys/.auth/state.json. The other projects need the local stack.
      - name: Playwright
        working-directory: webui
        env:
          HEADER_E2E_PORT: "5291"
        run: npx playwright test --project hermetic --project drawer --project drawer-header

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-results
          retention-days: 3
          if-no-files-found: ignore
          path: webui/test-results/

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit

      - name: Ignored advisories are still unreachable
        run: |
          if cargo tree --workspace --all-features --target all -i rsa 2>/dev/null | grep -q '^rsa v'; then
            echo "rsa is in the build graph; drop the RUSTSEC-2023-0071 ignore in .cargo/audit.toml" >&2
            exit 1
          fi

      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci --ignore-scripts

      - name: npm audit (webui)
        working-directory: webui
        continue-on-error: true
        run: npm audit --audit-level=high

  no-css-global:
    name: no-css-global
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/no-css-global.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject new :global(...) overrides in webui Svelte files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$head^"
          fi
          bash scripts/no-css-global.sh "$base...$head"

  comment-refs:
    name: comment-refs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the guard itself
        run: bash scripts/check-comment-refs.test.sh

      - name: Guard tests did not leak into this checkout
        run: bash scripts/check-git-untouched.sh

      - name: Reject ticket references in added comments
        run: bash scripts/check-comment-refs.sh "origin/${{ github.base_ref }}"

  i18n-messages:
    name: i18n-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject i18n sentence fragments and locale key drift
        run: bash scripts/check-i18n.test.sh

  release-channel:
    name: release-channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Map release tags to channels
        run: bash scripts/release-channel.test.sh

      - name: The release gate refuses a commit without a green run
        run: bash scripts/check-ci-green.test.sh

  local-seed:
    name: local-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The fixture seeds only the stack this checkout started
        run: bash deploy/local/fixture/seed.test.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      - name: actionlint
        run: ./actionlint -color

  # The single required check for branch protection: skipped jobs count as
  # passing, failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - fmt
      - biome
      - clippy
      - test
      - release-cache
      - release-cache-server
      - webui
      - e2e
      - audit
      - no-css-global
      - comment-refs
      - i18n-messages
      - release-channel
      - local-seed
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
