name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

# mlugg/setup-zig still ships as a node20 action; opt into the node24 runtime
# now so we don't emit the deprecation warning (GitHub forces node24 from
# 2026-06-16 anyway). Drop this once the action migrates to node24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgautoupgrade/pgautoupgrade:18-debian@sha256:5994de3d344b9c9676b571d10ff8259e155013f4e5477c58ceee74a42f6d2d20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cctui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cctui_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install sqlx-cli
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: sqlx-cli

      - name: Apply migrations
        run: sqlx migrate run --source migrations

      - name: cargo test (workspace)
        run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: darwin
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # The step above adds the cross target to the toolchain it installs; the
      # cross std must also land on the toolchain rust-toolchain.toml selects, or
      # the musl cross-compile fails with "can't find crate for core" (E0463).
      # No-op when the target equals the host (darwin).
      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # Linux artifacts are static musl builds so they run on any glibc
      # (the claude-worker image is debian bookworm = glibc 2.36, while the
      # default GitHub runners are glibc 2.39). cargo-zigbuild cross-compiles
      # both linux arches to musl from the x86 runner, using zig cc as the C
      # compiler for the rustls native deps. (CCT-117)
      - name: Set up zig + cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-zigbuild

      - name: Build cctui + cctui-daemon (offline sqlx)
        env:
          SQLX_OFFLINE: "true"
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            cargo zigbuild --release -p cctui-tui --target ${{ matrix.target }}
            cargo zigbuild --release -p cctui-daemon --target ${{ matrix.target }}
          else
            cargo build --release -p cctui-tui --target ${{ matrix.target }}
            cargo build --release -p cctui-daemon --target ${{ matrix.target }}
          fi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cctui" "dist/cctui-${{ matrix.os }}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/cctui-daemon" "dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}"

      # Unsigned arm64 macOS binaries are SIGKILLed at exec; don't rely on the
      # linker's implicit ad-hoc signature.
      - name: Ad-hoc codesign (darwin)
        if: matrix.os == 'darwin'
        run: |
          codesign --force --sign - dist/*
          codesign --verify --verbose dist/*

      # These are throwaway hand-offs to the `release` job within the same run;
      # the real binaries live on the published GitHub Release (unmetered
      # Releases storage). 1-day retention stops them piling up against the
      # 0.5 GB Actions-storage quota.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cctui-bins-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/cctui-${{ matrix.os }}-${{ matrix.arch }}
            dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum cctui-* cctui-daemon-* > SHA256SUMS
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/cctui-*
            dist/cctui-daemon-*
            dist/SHA256SUMS

  # Build + push the server and webui container images to ghcr, tag-driven.
  # Replaces the manual `make image/release` / `make ui/image/release` registry
  # push (which needs a local docker daemon bg agents can't reach). The build
  # is self-contained: public base images, crates.io deps, runtime-checked
  # sqlx (no DB at build), no secrets baked in. (CCT-199)
  images:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only — matches the single-arch local builds the cluster
      # runs today; rust-via-QEMU arm64 is too slow to justify here.
      - name: Build + push server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CCTUI_GIT_HASH=${{ github.sha }}
          tags: |
            ghcr.io/dorskfr/cctui:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui:latest

      - name: Build + push webui image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: webui/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CLIENT_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/dorskfr/cctui-ui:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui-ui:latest

      # The per-session worker image dispatchers spawn: claude code + codex +
      # cctui-daemon, non-enrolled (identity injected at spawn). (CCT-245)
      - name: Build + push worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/worker.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dorskfr/cctui-worker:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui-worker:latest

      # The standalone, enrolled kubernetes dispatcher: connects out to the
      # server and spawns worker Jobs in-cluster on dispatch. (CCT-291)
      - name: Build + push dispatcher-kube image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/dispatcher.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dorskfr/cctui-dispatcher-kube:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui-dispatcher-kube:latest

      - name: Build + push orchestrator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/orchestrator.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dorskfr/cctui-orchestrator:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui-orchestrator:latest

      - name: Build + push ghreview image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ghreview
          file: ghreview/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dorskfr/cctui-ghreview:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/cctui-ghreview:latest
