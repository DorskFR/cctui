name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

# mlugg/setup-zig still ships as a node20 action; opt into the node24 runtime
# now so we don't emit the deprecation warning (GitHub forces node24 from
# 2026-06-16 anyway). Drop this once the action migrates to node24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"

jobs:
  ci-green:
    name: ci passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a green ci run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-ci-green.sh "${{ github.repository }}" "${{ steps.sha.outputs.sha }}"

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [ci-green]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: darwin
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # The step above adds the cross target to the toolchain it installs; the
      # cross std must also land on the toolchain rust-toolchain.toml selects, or
      # the musl cross-compile fails with "can't find crate for core" (E0463).
      # No-op when the target equals the host (darwin).
      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # Linux artifacts are static musl builds so they run on any glibc
      # (the claude-worker image is debian bookworm = glibc 2.36, while the
      # default GitHub runners are glibc 2.39). cargo-zigbuild cross-compiles
      # both linux arches to musl from the x86 runner, using zig cc as the C
      # compiler for the rustls native deps. (CCT-117)
      - name: Set up zig + cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-zigbuild

      - name: Build cctui + cctui-daemon (offline sqlx)
        env:
          SQLX_OFFLINE: "true"
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            cargo zigbuild --release -p cctui-tui --target ${{ matrix.target }}
            cargo zigbuild --release -p cctui-daemon --target ${{ matrix.target }}
          else
            cargo build --release -p cctui-tui --target ${{ matrix.target }}
            cargo build --release -p cctui-daemon --target ${{ matrix.target }}
          fi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cctui" "dist/cctui-${{ matrix.os }}-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/cctui-daemon" "dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}"

      # The images job COPYs these static binaries instead of compiling in docker.
      - name: Build image binaries (linux-amd64)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        env:
          SQLX_OFFLINE: "true"
        run: |
          bins="cctui-daemon cctui-guard-proxy cctui-supervisor cctui-guard cctui-dispatcher-kube cctui-orchestrator"
          cargo zigbuild --release --target ${{ matrix.target }} $(printf -- '-p %s ' $bins)
          mkdir -p image-bins
          for b in $bins; do cp "target/${{ matrix.target }}/release/$b" image-bins/; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        with:
          name: image-bins
          retention-days: 1
          path: image-bins/

      # Unsigned arm64 macOS binaries are SIGKILLed at exec; don't rely on the
      # linker's implicit ad-hoc signature.
      - name: Ad-hoc codesign (darwin)
        if: matrix.os == 'darwin'
        run: |
          codesign --force --sign - dist/*
          codesign --verify --verbose dist/*

      # These are throwaway hand-offs to the `release` job within the same run;
      # the real binaries live on the published GitHub Release (unmetered
      # Releases storage). 1-day retention stops them piling up against the
      # 0.5 GB Actions-storage quota.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cctui-bins-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/cctui-${{ matrix.os }}-${{ matrix.arch }}
            dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: [ci-green, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: cctui-bins-*
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum cctui-* > SHA256SUMS
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      # MINISIGN_SECRET_KEY is the whole .key file (comment line + key line) of a
      # password-less key (`minisign -G -W`) whose public half is keys/release.minisign.pub.
      - name: Sign release assets
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 0600 "$key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in cctui-* SHA256SUMS; do
            minisign -S -s "$key" -m "$f" < /dev/null
          done
      - name: Verify signatures against the committed public key
        working-directory: dist
        run: |
          for f in cctui-* SHA256SUMS; do
            case "$f" in *.minisig) continue ;; esac
            minisign -V -p ../keys/release.minisign.pub -m "$f"
          done
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/cctui-*
            dist/cctui-daemon-*
            dist/SHA256SUMS
            dist/*.minisig

  # linux/amd64 only: rust-via-QEMU arm64 is too slow to justify here. Each
  # image keeps its own gha layer cache scope so unchanged layers (apt, node,
  # harness binaries) are reused across releases.
  images:
    name: image ${{ matrix.image }}
    needs: [ci-green]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cctui
            context: .
            file: deploy/Dockerfile
          - image: cctui-ui
            context: .
            file: webui/Dockerfile
          - image: cctui-ghreview
            context: ghreview
            file: ghreview/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            CCTUI_GIT_HASH=${{ needs.ci-green.outputs.sha }}
            CLIENT_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/dorskfr/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/${{ matrix.image }}:latest

  # These images take the linux-amd64 musl binaries from the build job through
  # the `bins` build context, so no Rust compiles inside docker.
  images-prebuilt:
    name: image ${{ matrix.image }}
    needs: [ci-green, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cctui-worker
            file: deploy/worker.Dockerfile
          - image: cctui-dispatcher-kube
            file: deploy/dispatcher.Dockerfile
          - image: cctui-orchestrator
            file: deploy/orchestrator.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-bins
          path: image-bins

      - name: Restore executable bits
        run: chmod 0755 image-bins/*

      - name: Resolve version
        id: ver
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded locally first so the worker's harness floors are checked against
      # the real binaries before anything is published; the push is a cache hit.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-contexts: bins=image-bins
          platforms: linux/amd64
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ghcr.io/dorskfr/${{ matrix.image }}:${{ steps.ver.outputs.version }}

      - name: Verify harness version floors in the worker image
        if: matrix.image == 'cctui-worker'
        run: bash scripts/check-worker-image-harness.sh ghcr.io/dorskfr/cctui-worker:${{ steps.ver.outputs.version }}

      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-contexts: bins=image-bins
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          tags: |
            ghcr.io/dorskfr/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ghcr.io/dorskfr/${{ matrix.image }}:latest
