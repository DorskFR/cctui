name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
      candidate:
        description: "Publish a vX.Y.Z tag as a pre-release that moves :candidate, not :latest"
        type: boolean
        default: false
      full:
        description: "Rebuild every component instead of carrying unchanged ones from the previous release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# mlugg/setup-zig still ships as a node20 action; opt into the node24 runtime
# now so we don't emit the deprecation warning (GitHub forces node24 from
# 2026-06-16 anyway). Drop this once the action migrates to node24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep in lockstep with rust-toolchain.toml and deploy/*.Dockerfile.
  RUST_VERSION: "1.97.1"
  CARGO_INCREMENTAL: "0"

jobs:
  meta:
    name: resolve release commit + channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.channel.outputs.tag }}
      version: ${{ steps.channel.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      make_latest: ${{ steps.channel.outputs.make_latest }}
      floating_tag: ${{ steps.channel.outputs.floating_tag }}
      minor_tag: ${{ steps.channel.outputs.minor_tag }}
      prev_tag: ${{ steps.scope.outputs.prev_tag }}
      prev_version: ${{ steps.scope.outputs.prev_version }}
      rust: ${{ steps.scope.outputs.rust }}
      modes: ${{ steps.scope.outputs.modes }}
      summary: ${{ steps.scope.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate && github.sha || inputs.tag || github.ref }}

      - name: Resolve release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # vX.Y.Z-beta.N publishes a pre-release that never becomes latest and
      # moves the :beta image tags instead of :latest. A stable tag takes
      # :latest only when no higher stable release exists.
      - name: Resolve release channel
        id: channel
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          MODE: ${{ inputs.candidate && 'candidate' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CCTUI_STABLE_TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | tr '\n' ' ')"
          export CCTUI_STABLE_TAGS
          echo "published stable tags: $CCTUI_STABLE_TAGS"
          args=("$TAG"); [ -n "$MODE" ] && args+=("$MODE")
          out="$(bash scripts/release-channel.sh "${args[@]}")"
          echo "$out"
          { echo "tag=$TAG"; echo "$out"; } >> "$GITHUB_OUTPUT"

      - name: Resolve what changed since the previous release
        id: scope
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CCTUI_FULL_RELEASE: ${{ inputs.full && 'true' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CCTUI_RELEASED_TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --exclude-drafts --json tagName --jq '.[].tagName' | tr '\n' ' ')"
          export CCTUI_RELEASED_TAGS
          out="$(bash scripts/release-scope.sh "$TAG" "$(git rev-parse HEAD)")"
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  # Only the publish steps (GitHub Release, image pushes) wait on this; builds
  # start right away and run alongside the ci.yml run for the same commit.
  ci-green:
    name: ci passed on this commit
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
          sparse-checkout: scripts

      - name: Require a green ci run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-ci-green.sh "${{ github.repository }}" "${{ needs.meta.outputs.sha }}"

  plugin-catalog:
    name: plugin catalog resolves
    needs: [meta]
    if: needs.meta.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-server
          save-if: false

      - name: Guard its own schema rules
        run: bash scripts/check-plugin-catalog.test.sh

      - name: Every entry resolves, matches its sha256 and installs
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/check-plugin-catalog.sh

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    needs: [meta]
    if: needs.meta.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: darwin
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # The step above adds the cross target to the toolchain it installs; the
      # cross std must also land on the toolchain rust-toolchain.toml selects, or
      # the musl cross-compile fails with "can't find crate for core" (E0463).
      # No-op when the target equals the host (darwin).
      - name: Add cross target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # Tag refs can only restore caches saved on the default branch, so the
      # `release-*` shared keys are populated by ci.yml on pushes to main (and by
      # candidate runs dispatched from main); a tag run then restores them.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      # Linux artifacts are static musl builds so they run on any glibc
      # (the claude-worker image is debian trixie = glibc 2.41, while the
      # default GitHub runners are glibc 2.39). cargo-zigbuild cross-compiles
      # both linux arches to musl from the x86 runner, using zig cc as the C
      # compiler for the rustls native deps.
      - name: Set up zig + cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild (linux)
        if: matrix.os == 'linux'
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-zigbuild

      # One invocation for every musl binary: separate `-p` runs unify features
      # differently and rebuild most of the dependency graph twice.
      - name: Build binaries (offline sqlx)
        env:
          SQLX_OFFLINE: "true"
        run: bash scripts/release-build-bins.sh "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        with:
          name: image-bins
          retention-days: 1
          path: image-bins/

      # Unsigned arm64 macOS binaries are SIGKILLed at exec; don't rely on the
      # linker's implicit ad-hoc signature.
      - name: Ad-hoc codesign (darwin)
        if: matrix.os == 'darwin'
        run: |
          codesign --force --sign - dist/*
          codesign --verify --verbose dist/*

      # These are throwaway hand-offs to the `release` job within the same run;
      # the real binaries live on the published GitHub Release (unmetered
      # Releases storage). 1-day retention stops them piling up against the
      # 0.5 GB Actions-storage quota.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cctui-bins-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/cctui-${{ matrix.os }}-${{ matrix.arch }}
            dist/cctui-daemon-${{ matrix.os }}-${{ matrix.arch }}

  # cctui-server links the distro OpenSSL (webauthn-rs), so it is not a musl
  # build. The runner's glibc must not be newer than the trixie-slim runtime
  # of deploy/Dockerfile (2.41); the build script enforces it.
  build-server:
    needs: [meta]
    if: needs.meta.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-server
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Build cctui-server for the image
        env:
          SQLX_OFFLINE: "true"
          CCTUI_GIT_HASH: ${{ needs.meta.outputs.sha }}
        run: bash scripts/release-build-server.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-bins-server
          retention-days: 1
          path: image-bins/


  release:
    needs: [meta, ci-green, plugin-catalog, build]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.ci-green.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.meta.outputs.rust == 'true'
        with:
          path: dist
          pattern: cctui-bins-*
          merge-multiple: true
      - name: Compute checksums
        if: needs.meta.outputs.rust == 'true'
        working-directory: dist
        run: sha256sum cctui-* > SHA256SUMS
      # The binaries embed their version, so a release without Rust changes
      # ships the previous release's signed assets unchanged.
      - name: Carry the previous release's assets
        if: needs.meta.outputs.rust != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ needs.meta.outputs.prev_tag }}
        run: |
          [ -n "$PREV_TAG" ] || { echo "no previous release to carry assets from" >&2; exit 1; }
          gh release download "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'cctui-*' --pattern 'SHA256SUMS*'
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      # MINISIGN_SECRET_KEY is the whole .key file (comment line + key line) of a
      # password-less key (`minisign -G -W`) whose public half is keys/release.minisign.pub.
      - name: Sign release assets
        if: needs.meta.outputs.rust == 'true'
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY is not set" >&2; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 0600 "$key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in cctui-* SHA256SUMS; do
            minisign -S -s "$key" -m "$f" < /dev/null
          done
      - name: Verify checksums and signatures against the committed public key
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          for f in cctui-* SHA256SUMS; do
            case "$f" in *.minisig) continue ;; esac
            minisign -V -p ../keys/release.minisign.pub -m "$f"
          done
      - name: Refuse a release without a resolved channel
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          MAKE_LATEST: ${{ needs.meta.outputs.make_latest }}
        run: |
          case "$CHANNEL/$PRERELEASE/$MAKE_LATEST" in
            stable/false/true | stable/false/false | stable/true/false | beta/true/false) ;;
            *) echo "unresolved release channel: '$CHANNEL/$PRERELEASE/$MAKE_LATEST'" >&2; exit 1 ;;
          esac
      # Read by the infra rollout to bump only the rebuilt components.
      - name: Record the release scope
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PREV_TAG: ${{ needs.meta.outputs.prev_tag }}
          RUST: ${{ needs.meta.outputs.rust }}
          MODES: ${{ needs.meta.outputs.modes }}
        run: |
          jq -n --arg version "$VERSION" --arg prev_tag "$PREV_TAG" \
            --argjson rust "$RUST" --argjson modes "$MODES" \
            '{version: $version, prev_tag: $prev_tag, rust: $rust, modes: $modes}' > dist/release-scope.json
          cat dist/release-scope.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          body: ${{ needs.meta.outputs.summary }}
          generate_release_notes: true
          files: |
            dist/cctui-*
            dist/SHA256SUMS*
            dist/release-scope.json

  # Every image is pushed by digest only, so nothing is tagged before ci-green;
  # `images-push` then just tags those digests (or the previous release's image
  # for a carried component). linux/amd64 only: rust-via-QEMU arm64 is too slow.
  # The ui needs no Rust, so it starts as soon as the scope is known.
  image-ui:
    name: image cctui-ui
    needs: [meta]
    if: fromJSON(needs.meta.outputs.modes)['cctui-ui'] != 'retag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: webui/Dockerfile
          platforms: linux/amd64
          build-args: |
            CLIENT_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=cctui-ui
          cache-to: type=gha,mode=max,scope=cctui-ui
          tags: ghcr.io/dorskfr/cctui-ui
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digest && echo "$DIGEST" > digest/cctui-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-cctui-ui
          retention-days: 1
          path: digest/

  # `build` takes the linux-amd64 binaries from this run; `prevbins` (a Dockerfile
  # change without a Rust change) takes them from the previous release's image.
  # The `bins` build context replaces each Dockerfile's builder stage either way.
  images:
    name: image ${{ matrix.image }}
    needs: [meta, build, build-server]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      MODE: ${{ fromJSON(needs.meta.outputs.modes)[matrix.image] }}
      IMAGE: ghcr.io/dorskfr/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cctui
            file: deploy/Dockerfile
            bins: cctui-server
          - image: cctui-worker
            file: deploy/worker.Dockerfile
            bins: cctui-daemon cctui-guard-proxy cctui-supervisor cctui-guard
          - image: cctui-dispatcher-kube
            file: deploy/dispatcher.Dockerfile
            bins: cctui-dispatcher-kube
          - image: cctui-orchestrator
            file: deploy/orchestrator.Dockerfile
            bins: cctui-orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.MODE != 'retag'
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.MODE == 'build'
        with:
          pattern: image-bins*
          merge-multiple: true
          path: image-bins

      - name: Restore executable bits
        if: env.MODE == 'build'
        run: chmod 0755 image-bins/*

      - name: Log in to ghcr
        if: env.MODE != 'retag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the binaries from the previous release's image
        if: env.MODE == 'prevbins'
        env:
          PREV_VERSION: ${{ needs.meta.outputs.prev_version }}
          BIN_NAMES: ${{ matrix.bins }}
        run: |
          read -ra names <<< "$BIN_NAMES"
          bash scripts/release-prev-bins.sh "$IMAGE:$PREV_VERSION" image-bins "${names[@]}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.MODE != 'retag'

      - name: Build and push by digest
        id: build
        if: env.MODE != 'retag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-contexts: bins=image-bins
          platforms: linux/amd64
          build-args: |
            CCTUI_GIT_HASH=${{ needs.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      # Still untagged, so a harness below the floor fails the release here.
      - name: Verify harness version floors in the worker image
        if: matrix.image == 'cctui-worker' && env.MODE != 'retag'
        run: bash scripts/check-worker-image-harness.sh "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Record digest
        if: env.MODE != 'retag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digest && echo "$DIGEST" > "digest/${{ matrix.image }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.MODE != 'retag'
        with:
          name: digest-${{ matrix.image }}
          retention-days: 1
          path: digest/

  images-push:
    name: push ${{ matrix.image }}
    needs: [meta, ci-green, plugin-catalog, image-ui, images]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.ci-green.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      MODE: ${{ fromJSON(needs.meta.outputs.modes)[matrix.image] }}
      IMAGE: ghcr.io/dorskfr/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [cctui, cctui-worker, cctui-dispatcher-kube, cctui-orchestrator, cctui-ui]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: env.MODE != 'retag'
        with:
          name: digest-${{ matrix.image }}
          path: digest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PREV_VERSION: ${{ needs.meta.outputs.prev_version }}
          FLOATING: ${{ needs.meta.outputs.floating_tag }}
          MINOR: ${{ needs.meta.outputs.minor_tag }}
        run: |
          if [ "$MODE" = retag ]; then
            [ -n "$PREV_VERSION" ] || { echo "no previous release to carry $IMAGE from" >&2; exit 1; }
            src="$IMAGE:$PREV_VERSION"
          else
            src="$IMAGE@$(cat "digest/${{ matrix.image }}")"
          fi
          args=()
          for t in "$VERSION" "$FLOATING" "$MINOR"; do
            [ -n "$t" ] && args+=(--tag "$IMAGE:$t")
          done
          echo "$src -> ${args[*]}"
          docker buildx imagetools create "${args[@]}" "$src"
