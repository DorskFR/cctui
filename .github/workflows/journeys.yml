name: journeys

# The screens under docs/journeys are captured on a developer's machine against
# a seeded stack and committed with the change that moved them, so there is
# nothing here to generate. This shows the ones a pull request moved, points out
# a UI change that forgot to refresh them, and never fails the run.
on:
  pull_request:
    paths:
      - 'webui/**'
      - '.github/workflows/journeys.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: report
        run: |
          node webui/scripts/journey-report.mjs \
            --base "origin/${{ github.base_ref }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --repo "${{ github.repository }}" > report.md || true
          echo "any=$([ -s report.md ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- journey-report -->';
            const hasReport = '${{ steps.report.outputs.any }}' === 'yes';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const mine = comments.find((c) => c.body.includes(marker));
            if (!hasReport) {
              if (mine) await github.rest.issues.deleteComment({ owner, repo, comment_id: mine.id });
              return;
            }
            const body = `${marker}\n${fs.readFileSync('report.md', 'utf8')}`;
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
