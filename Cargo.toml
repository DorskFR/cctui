[workspace]
resolver = "2"
members = [
    "crates/cctui-admin",
    "crates/cctui-daemon",
    "crates/cctui-dispatcher-docker",
    "crates/cctui-dispatcher-kube",
    "crates/cctui-github",
    "crates/cctui-guard",
    "crates/cctui-guard-proxy",
    "crates/cctui-proto",
    "crates/cctui-server",
    "crates/cctui-supervisor",
    "crates/cctui-tui",
]

[workspace.package]
version = "0.7.22"
edition = "2024"
license = "MIT"
authors = ["DorskFR"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
cctui-proto = { path = "crates/cctui-proto" }
cctui-github = { path = "crates/cctui-github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
thiserror = "2"
tempfile = "3"
tokio-util = "0.7"
async-trait = "0.1"
kube = { version = "0.96", default-features = false, features = ["client", "rustls-tls", "runtime"] }
k8s-openapi = { version = "0.23", features = ["latest"] }
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
