[workspace]
resolver = "2"
members = [
    "crates/cctui-admin",
    "crates/cctui-crypto",
    "crates/cctui-daemon",
    "crates/cctui-dispatcher-apple",
    "crates/cctui-dispatcher-docker",
    "crates/cctui-dispatcher-kube",
    "crates/cctui-github",
    "crates/cctui-guard",
    "crates/cctui-guard-proxy",
    "crates/cctui-orchestrator",
    "crates/cctui-proto",
    "crates/cctui-query",
    "crates/cctui-server",
    "crates/cctui-supervisor",
    "crates/cctui-tui",
]

[workspace.package]
version = "0.7.222"
edition = "2024"
license = "MIT"
authors = ["DorskFR"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
cctui-proto = { path = "crates/cctui-proto" }
cctui-crypto = { path = "crates/cctui-crypto" }
cctui-query = { path = "crates/cctui-query" }
cctui-github = { path = "crates/cctui-github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zstd = "0.13"
tar = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
# =-pinned: 10.x raises the MSRV past the pinned 1.90.0 toolchain; 9.3 uses the
# `ring` already in the tree.
jsonwebtoken = { version = "=9.3.1", default-features = false, features = ["use_pem"] }
thiserror = "2"
tempfile = "3"
tokio-util = "0.7"
async-trait = "0.1"
# =-pinned: newer AWS SDK releases require rustc 1.94.1, toolchain is pinned to 1.90.0
aws-config = { version = "=1.8.13", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "=1.99.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "=1.3.8", default-features = false, features = ["sign-http"] }
aws-credential-types = "=1.2.11"
kube = { version = "0.96", default-features = false, features = ["client", "rustls-tls", "runtime", "derive", "admission"] }
json-patch = "2"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
k8s-openapi = { version = "0.23", features = ["latest", "schemars"] }
schemars = { version = "0.8", features = ["derive"] }
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl", "uuid-impl"] }
