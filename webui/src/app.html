<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- viewport-fit=cover so env(safe-area-inset-*) is honoured on phones
		     with a notch / bottom gesture bar / browser address bar.
		     interactive-widget=resizes-content keeps fixed headers on screen when
		     the on-screen keyboard opens: the keyboard shrinks the
		     layout viewport instead of scrolling fixed elements out of view. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#0f1115" />
		<meta name="color-scheme" content="dark light" />
		<title>cctui</title>
		<!-- Runtime config: deploy can override window.CCTUI_CONFIG (api base /
		     ws base) without rebuilding. Served as a static asset. -->
		<script src="%sveltekit.assets%/config.js"></script>
		<!-- The journey book driver mounts its own probe-less runtime into
		     `window.__journey` at the load event, and the first runtime to claim
		     the slot is the one that keeps it — the app boots too late to win.
		     Park a forwarder here so the driver waits for the runtime
		     `mountJourneys` mounts, probes and all. Inert outside a book run. -->
		<script>
			(function () {
				if (new URLSearchParams(location.search).get('journey') === 'run') {
					sessionStorage.setItem('journey:driver', '1');
				}
				if (sessionStorage.getItem('journey:driver') !== '1') return;
				var mounted = new Promise(function (resolve, reject) {
					window.__journeyReady = resolve;
					setTimeout(function () {
						reject(new Error('journey: the app runtime never mounted'));
					}, 60000);
				});
				mounted.catch(function () {});
				var on = function (use) {
					return mounted.then(use);
				};
				window.__journey = {
					translate: function () {
						return '';
					},
					applyVariant: function (dim, value) {
						return on(function (api) {
							return api.applyVariant(dim, value);
						});
					},
					driver: {
						load: function (ir, opts) {
							return on(function (api) {
								return api.driver.load(ir, opts);
							});
						},
						step: function () {
							return on(function (api) {
								return api.driver.step();
							});
						},
						acted: function () {
							return on(function (api) {
								return api.driver.acted();
							});
						},
						settle: function () {
							return on(function (api) {
								return api.driver.settle();
							});
						}
					}
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
