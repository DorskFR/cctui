server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Long-cache hashed build assets.
	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Runtime config must never be cached — it is how a deploy retargets the API.
	location = /config.js {
		add_header Cache-Control "no-store";
		try_files $uri =404;
	}

	# SPA fallback: every unknown path resolves to the client-rendered app.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
