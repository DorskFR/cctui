server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# add_header in a location block drops all headers inherited from the server
	# block, so the security headers are repeated in each location that sets its
	# own Cache-Control.

	# Long-cache hashed build assets.
	location /_app/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		try_files $uri =404;
	}

	# Runtime config must never be cached — it is how a deploy retargets the API.
	location = /config.js {
		add_header Cache-Control "no-store";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		try_files $uri =404;
	}

	# SPA fallback: every unknown path resolves to the client-rendered app.
	location / {
		# adapter-static emits one inline bootstrap <script>. Stamp a per-request
		# nonce onto it so script-src can stay 'self' (no 'unsafe-inline', which
		# would re-enable the inline-handler XSS the CSP exists to block).
		sub_filter '<script>' '<script nonce="$request_id">';
		sub_filter_once off;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header X-Frame-Options "DENY" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
		try_files $uri $uri/ /index.html;
	}
}
